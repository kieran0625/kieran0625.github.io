  <script>window.QUESTION_BANK = {"version":1,"chapters":[{"number":1,"title":"工程伦理概论","count":20},{"number":2,"title":"工程伦理方法","count":23},{"number":3,"title":"工程师的职业伦理","count":18},{"number":4,"title":"工程前端设计规范","count":23},{"number":5,"title":"工程管理伦理","count":20},{"number":6,"title":"多元文化背景下的工程伦理","count":22},{"number":7,"title":"从业工程师的实践伦理","count":22},{"number":8,"title":"传感器技术中的工程伦理","count":24},{"number":9,"title":"人工智能及其伦理","count":19},{"number":10,"title":"航空领域工程伦理","count":20},{"number":11,"title":"网络安全中的工程伦理","count":19},{"number":12,"title":"智能制造领域工程伦理","count":11},{"number":13,"title":"能源动力领域工程伦理","count":21},{"number":14,"title":"道路交通工程中的工程伦理","count":18},{"number":15,"title":"集成电路领域工程伦理","count":23}],"questions":[{"id":"1-1","chapter":1,"number":1,"type":"single","stem":"把工程看成是科学技术的应用是一种对工程的认识，以下哪一种对工程的说法，与这种认识不同（ ）","options":[{"key":"A","text":"工程是指将科学知识系统运用于结构和机器的设计、制造和使用中"},{"key":"B","text":"工程是将自然科学的原理应用到工农业生产部门中去而形成的各学科的总称。"},{"key":"C","text":"工程是一种实践性研究，研究如何利用各种科学方法使得人和物以及环境以更健康、更安全、更高效的方式相结合，从而赋能个人，促进社会的福祉。"},{"key":"D","text":"工程是指将科学知识应用于工农业生产过程而形成的各学科的总称，如土木工程、水利工程、冶金工程、机电工程、化学工程等，其目的在于利用和改造自然为人类服务。"}],"answer":["C"],"explanation":"**C** — 题干的认识是\"工程＝科学技术的应用\"。A、B、D 都是把工程定义为科学（知识/原理）的应用或由此形成的学科总称，属于同一种认识；只有 C 把工程定义为一种\"实践性研究\"，强调人与物、环境的结合方式，是另一种认识。","note":""},{"id":"1-2","chapter":1,"number":2,"type":"single","stem":"伦理准则在哪一个阶段强调效率（ ）","options":[{"key":"A","text":"19世纪中后期"},{"key":"B","text":"20世纪上半叶"},{"key":"C","text":"第二次世界大战之后"},{"key":"D","text":"21世纪初"}],"answer":["B"],"explanation":"**B（20世纪上半叶）** — 工程伦理章程的历史演变：20世纪上半叶的伦理准则强调效率；二战之后才转向把公众的安全、健康和福祉放在首位。","note":""},{"id":"1-3","chapter":1,"number":3,"type":"single","stem":"工程的概念最初主要用于指代与（ ）相关的设计和建造活动","options":[{"key":"A","text":"科技"},{"key":"B","text":"军事"},{"key":"C","text":"水利"},{"key":"D","text":"建筑"}],"answer":["B"],"explanation":"**B（军事）** — \"工程\"（engineering）概念最初主要指与军事相关的设计和建造活动，后来才衍生出土木工程等民用领域。","note":""},{"id":"1-4","chapter":1,"number":4,"type":"single","stem":"描述伦理学主要是（ ）","options":[{"key":"A","text":"描述现行的道德现象"},{"key":"B","text":"提出规范性的道德建议"},{"key":"C","text":"理解道德价值"},{"key":"D","text":"解决道德问题"}],"answer":["A"],"explanation":"**A（描述现行的道德现象）** — 描述伦理学以经验描述的方式研究实际存在的道德现象，不提出规范性建议（那是规范伦理学的任务）。","note":""},{"id":"1-5","chapter":1,"number":5,"type":"single","stem":"工程师的职业伦理开始有明文规定是在哪个时期（ ）","options":[{"key":"A","text":"18世纪初期"},{"key":"B","text":"19世纪中后期"},{"key":"C","text":"20世纪上半叶"},{"key":"D","text":"第二次世界大战之后"}],"answer":["B"],"explanation":"**B（19世纪中后期）** — 工程师的职业伦理章程在19世纪中后期开始有明文规定（美国等国工程师职业团体相继成立并制定章程）。","note":""},{"id":"1-6","chapter":1,"number":6,"type":"single","stem":"1913年统一成立的工程师协会的名称是（ ）","options":[{"key":"A","text":"中华工程师协会"},{"key":"B","text":"中国工程师学会"},{"key":"C","text":"中华工程师会"},{"key":"D","text":"中国工程师协会"}],"answer":["C"],"explanation":"**C（中华工程师会）** — 1913年由三个学会合并统一成立的协会名为\"中华工程师会\"。","note":""},{"id":"1-7","chapter":1,"number":7,"type":"single","stem":"工程伦理的基础伦理理论包括（ ）","options":[{"key":"A","text":"结果论"},{"key":"B","text":"行为论"},{"key":"C","text":"行动者论"},{"key":"D","text":"以上都是"}],"answer":["D"],"explanation":"**D（以上都是）** — 工程伦理的基础伦理理论包括结果论（功利论）、行为论（义务论）、行动者论（德性论）。","note":""},{"id":"1-8","chapter":1,"number":8,"type":"single","stem":"威廉·戴维德·罗斯（William David Ross）批评康德（Immanuel Kant）的伦理学，提出了哪一个理论（ ）","options":[{"key":"A","text":"互惠理论"},{"key":"B","text":"多元化理论"},{"key":"C","text":"善良意志理论"},{"key":"D","text":"平衡理论"}],"answer":["B"],"explanation":"**B（多元化理论）** — 罗斯（W. D. Ross）批评康德的一元义务论，提出显见义务多元的\"多元化理论\"。","note":""},{"id":"1-9","chapter":1,"number":9,"type":"single","stem":"工程伦理从工程实践活动的视角来看，是指（ ）","options":[{"key":"A","text":"调整工程与技术、工程与社会之间关系的道德规范"},{"key":"B","text":"培养工程师的高尚、卓越的品格"},{"key":"C","text":"工程师对人类利益的关心，对绝大多数社会成员的关爱和尊重之心"},{"key":"D","text":"工程师在工程活动中应该时时树立维护公众权利的意识"}],"answer":["A"],"explanation":"**A** — 从工程实践活动的视角看，工程伦理是调整工程与技术、工程与社会之间关系的道德规范。（B 是职业—品格视角，C、D 是职业责任层面的表述。）","note":""},{"id":"1-10","chapter":1,"number":10,"type":"multiple","stem":"工程实践过程面临的多重风险包括（ ）","options":[{"key":"A","text":"多种技术集成后应用于自然界所带来的环境风险"},{"key":"B","text":"安全风险"},{"key":"C","text":"利用技术建造人工物的质量风险"},{"key":"D","text":"工程应用于社会所导致的部分群体利益冲突和受损的风险"}],"answer":["A","B","C","D"],"explanation":"**ABCD** — 工程实践面临多重风险：环境风险、安全风险、质量风险，以及社会利益冲突和受损的风险，四项都是。","note":""},{"id":"1-11","chapter":1,"number":11,"type":"multiple","stem":"以下哪些是康德的理论（ ）","options":[{"key":"A","text":"绝对律令"},{"key":"B","text":"假言规范"},{"key":"C","text":"平等假设"},{"key":"D","text":"多元化理论"}],"answer":["A","B","C"],"explanation":"**ABC** — 康德的理论包括绝对律令、假言规范、平等假设；\"多元化理论\"是罗斯的，不是康德的。","note":""},{"id":"1-12","chapter":1,"number":12,"type":"multiple","stem":"中华工程师会由哪几个学会协商决议而成（ ）","options":[{"key":"A","text":"广东中华工程师会"},{"key":"B","text":"中华工学会"},{"key":"C","text":"中华工程师协会"},{"key":"D","text":"路工同人共济会"}],"answer":["A","B","D"],"explanation":"**ABD** — 1913年中华工程师会由广东中华工程师会、中华工学会、路工同人共济会三个学会协商决议合并而成（\"中华工程师协会\"是干扰项）。","note":""},{"id":"1-13","chapter":1,"number":13,"type":"multiple","stem":"多元化理论包含几个层面的内容（ ）","options":[{"key":"A","text":"中道平衡"},{"key":"B","text":"多元律令"},{"key":"C","text":"显见规范"},{"key":"D","text":"义务伦理"}],"answer":["C","D"],"explanation":"**CD** — 罗斯的多元化理论包含两个层面的内容：显见规范与义务伦理。","note":""},{"id":"1-14","chapter":1,"number":14,"type":"multiple","stem":"工程伦理的准则不包括（ ）","options":[{"key":"A","text":"调节关系"},{"key":"B","text":"关爱生命"},{"key":"C","text":"经济发展"},{"key":"D","text":"安全可靠"}],"answer":["A","C"],"explanation":"**AC** — 工程伦理的准则（关爱生命、安全可靠、公平正义、诚信等）不包括\"调节关系\"和\"经济发展\"。","note":""},{"id":"1-15","chapter":1,"number":15,"type":"multiple","stem":"一种行为如果有助于增进幸福，则为正确；如果导致了与幸福相反的东西，则为错误的。以下不是这种观点的有（ ）","options":[{"key":"A","text":"功利论"},{"key":"B","text":"契约论"},{"key":"C","text":"义务论"},{"key":"D","text":"德性论"}],"answer":["B","C","D"],"explanation":"**BCD** — \"有助于增进幸福即为正确\"是功利论（密尔）的观点；契约论、义务论、德性论都不是这种观点。","note":""},{"id":"1-16","chapter":1,"number":16,"type":"multiple","stem":"工程伦理主要可以从哪些角度理解（ ）","options":[{"key":"A","text":"社会实践"},{"key":"B","text":"工程发展"},{"key":"C","text":"伦理体系建构"},{"key":"D","text":"职业"}],"answer":["A","D"],"explanation":"**AD** — 工程伦理主要可以从社会实践和职业两个角度理解。","note":""},{"id":"1-17","chapter":1,"number":17,"type":"multiple","stem":"关于工程伦理及相关领域，以下说法正确的是（ ）","options":[{"key":"A","text":"工程实践既是应用科学与技术改造物质世界的自然实践，更是改进社会生活和调节利益关系的社会实践"},{"key":"B","text":"伦理是处理人与人、人与社会、人与自然相互关系应遵循的行为规范"},{"key":"C","text":"加之标准的多元化以及现实的人类环境本身的复杂性，常常导致在具体情境之下的道德判断与抉择的两难困境"},{"key":"D","text":"在解决工程伦理问题时，存在统一的、普遍使用的伦理准则"}],"answer":["A","B","C"],"explanation":"**ABC** — A、B、C 是教材观点；D 错误，正因为不存在统一的、普遍适用的伦理准则，标准多元化加上现实复杂性才导致道德判断的两难困境。","note":""},{"id":"1-18","chapter":1,"number":18,"type":"boolean","stem":"伦理推理可以为无论善恶的任何目的的服务。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** — 伦理推理本身有道德指向，不能为无论善恶的任何目的服务。","note":""},{"id":"1-19","chapter":1,"number":19,"type":"boolean","stem":"1941年，中国工程师会将《中国工程师信条规条》改为《中国工程师信条》。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** — 1941年，中国工程师会将《中国工程师信条规条》改为《中国工程师信条》。","note":""},{"id":"1-20","chapter":1,"number":20,"type":"boolean","stem":"自1909年詹天佑修筑京张铁路，中国近代工程事业逐渐摆脱列强控制走向独立自强之路，中国工程师的地位和作用大大提升。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** — 自1909年詹天佑建成京张铁路起，中国近代工程事业逐渐摆脱列强控制走向独立自强，中国工程师的地位和作用大大提升。","note":""},{"id":"2-1","chapter":2,"number":1,"type":"single","stem":"通常采用哪种方法，会得出非黑即白的决策方案（ ）","options":[{"key":"A","text":"功利主义方法"},{"key":"B","text":"划界法"},{"key":"C","text":"尊重人的方法"},{"key":"D","text":"伦理周期的方法"}],"answer":["B"],"explanation":"**B（划界法）** — 划界法通过在\"可接受\"与\"不可接受\"之间画一条界线来把关，结果是非黑即白（过线/不过线）的决策。","note":""},{"id":"2-2","chapter":2,"number":2,"type":"single","stem":"\"关于什么是道德上应当的和什么是好的\"的研究是哪一种研究方法的表现形式（ ）","options":[{"key":"A","text":"规范性研究"},{"key":"B","text":"概念性研究"},{"key":"C","text":"事实性研究"},{"key":"D","text":"历史性研究"}],"answer":["A"],"explanation":"**A（规范性研究）** — 研究\"什么是道德上应当的、什么是好的\"属于规范性研究；事实性研究描述\"是什么\"，概念性研究澄清概念。","note":""},{"id":"2-3","chapter":2,"number":3,"type":"single","stem":"为减少多方相关主体之间的利益争议，在各方均可接受的范围内，作出各方都相对满意的决策是指哪一种方法（ ）","options":[{"key":"A","text":"划界法"},{"key":"B","text":"黄金法则"},{"key":"C","text":"中间道路的方法"},{"key":"D","text":"伦理周期的方法"}],"answer":["C"],"explanation":"**C（中间道路的方法）** — 在各方均可接受的范围内寻求各方相对满意的方案，即折中调和的中间道路方法。","note":""},{"id":"2-4","chapter":2,"number":4,"type":"single","stem":"权利方法的深层次逻辑是（ ）","options":[{"key":"A","text":"运用法律的武器维护自己的合法权利"},{"key":"B","text":"个体不应当被剥夺某些事物，如果剥夺了，会使个体无法履行道德主体性"},{"key":"C","text":"当道德无法发挥作用时，介入法律"},{"key":"D","text":"个体通过权利确证自己是道德主体"}],"answer":["B"],"explanation":"**B** — 权利方法的深层逻辑：个体不应被剥夺某些事物，否则无法履行道德主体性（权利是道德主体性的条件）。","note":""},{"id":"2-5","chapter":2,"number":5,"type":"single","stem":"从哪一种角度来看，\"重要的是一种行为的后果，而不是其背后的意图\"（ ）","options":[{"key":"A","text":"功利主义的角度"},{"key":"B","text":"尊重人的角度"},{"key":"C","text":"规范的角度"},{"key":"D","text":"权利的角度"}],"answer":["A"],"explanation":"**A（功利主义的角度）** — \"重要的是行为后果而非意图\"是典型的功利主义（结果论）视角。","note":""},{"id":"2-6","chapter":2,"number":6,"type":"single","stem":"\"在汽车事故死亡人数的减少与使用尸体进行碰撞实验得出的数据之间是否存在显著的相关性\"是哪一种方法的表述方式（ ）","options":[{"key":"A","text":"规范性研究"},{"key":"B","text":"概念性研究"},{"key":"C","text":"事实性研究"},{"key":"D","text":"历史性研究"}],"answer":["C"],"explanation":"**C（事实性研究）** — \"汽车事故死亡人数的减少与碰撞实验数据之间是否存在显著相关性\"是可用经验数据检验的事实性问题。","note":""},{"id":"2-7","chapter":2,"number":7,"type":"single","stem":"道德决策得以可能的关键是（ ）","options":[{"key":"A","text":"问题表述"},{"key":"B","text":"问题分析"},{"key":"C","text":"选择评估"},{"key":"D","text":"选择反思"}],"answer":["B"],"explanation":"**B（问题分析）** — 道德决策得以可能的关键在于问题分析（厘清利益相关者、价值观与事实）。","note":""},{"id":"2-8","chapter":2,"number":8,"type":"single","stem":"反思中较为著名的方法是（ ）","options":[{"key":"A","text":"论析法"},{"key":"B","text":"功利主义方法"},{"key":"C","text":"评估法"},{"key":"D","text":"多元反思平衡法"}],"answer":["D"],"explanation":"**D（多元反思平衡法）** — 反思中较著名的方法是多元反思平衡法（wide reflective equilibrium 的运用）。","note":""},{"id":"2-9","chapter":2,"number":9,"type":"single","stem":"反思的核心步骤是（ ）","options":[{"key":"A","text":"评估"},{"key":"B","text":"辩护"},{"key":"C","text":"证明"},{"key":"D","text":"论证"}],"answer":["D"],"explanation":"**D（论证）** — 反思的核心步骤是论证。","note":""},{"id":"2-10","chapter":2,"number":10,"type":"single","stem":"工程伦理的分析方法中，以货币计量的方式评估每项选择的成本与收益，作出可能会产生更大收益的选择的方法是（ ）","options":[{"key":"A","text":"划界法"},{"key":"B","text":"中间道路的方法"},{"key":"C","text":"功利主义的方法"},{"key":"D","text":"尊重人的方法"}],"answer":["C"],"explanation":"**C（功利主义的方法）** — 以货币计量评估每项选择的成本与收益、选收益更大者，即成本—收益分析的功利主义方法。","note":""},{"id":"2-11","chapter":2,"number":11,"type":"multiple","stem":"在权利方法中，行使权利的力量被削弱，表现有（ ）","options":[{"key":"A","text":"全部权利被侵犯"},{"key":"B","text":"道德主体性被侵犯"},{"key":"C","text":"潜在的侵犯权利"},{"key":"D","text":"部分的侵犯权利"}],"answer":["C","D"],"explanation":"**CD** — 行使权利的力量被削弱表现为：潜在的侵犯权利与部分的侵犯权利（并非\"全部被侵犯\"或直接侵犯道德主体性）。","note":""},{"id":"2-12","chapter":2,"number":12,"type":"multiple","stem":"自我不利的方法有哪几种表现形式（ ）","options":[{"key":"A","text":"一种行为如果是被普遍认可的，那么它有时是不能得到实施的"},{"key":"B","text":"我\"可以独立完成某项任务，但是其他人会介入到\"我\"所做的事情中，这种介入会破坏\"我\"行为的目的"},{"key":"C","text":"为实现协商一致，\"我\"应当在道德上作出对自我不利的选择"},{"key":"D","text":"当我们认为我们所作出的行为是合乎道德的，那么在类似的情况下，别人作出同样行为的时候，也应当被认为是可接受的"}],"answer":["A","B"],"explanation":"**AB** — 自我不利方法的两种表现形式：①行为被普遍认可时有时不能实施；②他人介入会破坏\"我\"行为的目的。（C、D 分别是自我牺牲与普遍化/黄金法则的表述，不属此类。）","note":""},{"id":"2-13","chapter":2,"number":13,"type":"multiple","stem":"问题分析阶段需要分析的相关要素有（ ）","options":[{"key":"A","text":"问题表述"},{"key":"B","text":"利益相关者及其各自所代表的利益"},{"key":"C","text":"与伦理问题相关的价值观"},{"key":"D","text":"相关事实"}],"answer":["B","C","D"],"explanation":"**BCD** — 问题分析阶段需要分析：利益相关者及其利益、相关价值观、相关事实。（\"问题表述\"是上一阶段的任务。）","note":""},{"id":"2-14","chapter":2,"number":14,"type":"multiple","stem":"工程伦理的分析方法中，尊重人的方法主要包括（ ）","options":[{"key":"A","text":"黄金法则"},{"key":"B","text":"自我不利方法"},{"key":"C","text":"权利的方法"},{"key":"D","text":"中间道路的方法"}],"answer":["A","B","C"],"explanation":"**ABC** — 尊重人的方法主要包括黄金法则、自我不利方法、权利的方法。","note":""},{"id":"2-15","chapter":2,"number":15,"type":"multiple","stem":"伦理评估需要以道德框架为前置性标准，那么道德框架有以下几种（ ）","options":[{"key":"A","text":"目的伦理框架"},{"key":"B","text":"正式理论框架"},{"key":"C","text":"义务伦理框架"},{"key":"D","text":"非正式理论框架"}],"answer":["B","D"],"explanation":"**BD** — 道德框架分为正式理论框架与非正式理论框架两类。","note":""},{"id":"2-16","chapter":2,"number":16,"type":"multiple","stem":"工程伦理的分析方法中，划界法的局限性有（ ）","options":[{"key":"A","text":"只能在个体或群体进行道德决策时进行方向性的把关"},{"key":"B","text":"没有综合多方参与者的需求"},{"key":"C","text":"没有对其后行动方案的反思与评价"},{"key":"D","text":"没有对成本与收益的货币计量"}],"answer":["A","B"],"explanation":"**AB** — 划界法的局限性：只能在道德决策时做方向性把关，且没有综合多方参与者的需求。","note":""},{"id":"2-17","chapter":2,"number":17,"type":"multiple","stem":"道德问题表述的基本条件（ ）","options":[{"key":"A","text":"精确问题是什么"},{"key":"B","text":"核定某种行为或技术是否可以被接受"},{"key":"C","text":"明晰谁应该采取行动"},{"key":"D","text":"清楚说明问题的道德本质"}],"answer":["A","C","D"],"explanation":"**ACD** — 道德问题表述的基本条件：精确问题是什么、明晰谁应该采取行动、清楚说明问题的道德本质。","note":""},{"id":"2-18","chapter":2,"number":18,"type":"multiple","stem":"多元反思平衡的反思方法是以下哪几种道德理念的连贯（ ）","options":[{"key":"A","text":"道德评估"},{"key":"B","text":"道德判断"},{"key":"C","text":"道德原则"},{"key":"D","text":"背景理论"}],"answer":["B","C","D"],"explanation":"**BCD** — 多元反思平衡是道德判断、道德原则与（背景）理论的连贯。","note":""},{"id":"2-19","chapter":2,"number":19,"type":"boolean","stem":"事实性研究是最为核心的研究方法。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** — 三种研究相互联系补充，事实性研究并非\"最为核心\"。","note":""},{"id":"2-20","chapter":2,"number":20,"type":"boolean","stem":"概念性研究也被称为描述性研究。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** — 概念性研究是对概念的分析澄清；\"描述性研究\"对应的是事实性研究，二者不能混同。","note":""},{"id":"2-21","chapter":2,"number":21,"type":"boolean","stem":"功利主义模型的道德标准是：应进行那些使人类福祉最大化的行为或实践。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** — 这正是功利主义（行为功利主义）的道德标准。","note":""},{"id":"2-22","chapter":2,"number":22,"type":"boolean","stem":"事实性研究、概念性研究、规范性研究相互联系、相互补充。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** — 三种研究相互联系、相互补充。","note":""},{"id":"2-23","chapter":2,"number":23,"type":"boolean","stem":"\"当我们认为我们所作出的行为是合乎道德的，那么在类似的情况下，别人作出同样行为的时候，也应当被认为是可接受的。\"这是权利方法的表现形式。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** — 这句是黄金法则/可普遍化（自我不利方法、康德式普遍化）的表述，不是权利方法的表现形式。","note":""},{"id":"3-1","chapter":3,"number":1,"type":"single","stem":"当理想与一个 ______ 紧密联系，我们把这种理想称之为职业理想。","options":[{"key":"A","text":"职业"},{"key":"B","text":"个人"},{"key":"C","text":"精神"},{"key":"D","text":"思想"}],"answer":["A"],"explanation":"**A（职业）**\n职业理想的定义：当理想与具体的\"职业\"紧密联系时，称为职业理想。个人/精神/思想均不构成\"职业\"指向。","note":""},{"id":"3-2","chapter":3,"number":2,"type":"single","stem":"工程职业的职业主体是 ______。","options":[{"key":"A","text":"工人"},{"key":"B","text":"专家"},{"key":"C","text":"工程师"},{"key":"D","text":"技术员"}],"answer":["C"],"explanation":"**C（工程师）**\n工程职业的主体是工程师——受过专业训练、以工程为职业的群体；工人、技术员是工程活动的参与者但非职业主体，\"专家\"过于宽泛。","note":""},{"id":"3-3","chapter":3,"number":3,"type":"single","stem":"______ 是指努力开发新的技术和接受来自技术的挑战的理想。","options":[{"key":"A","text":"科研热情"},{"key":"B","text":"技术热情"},{"key":"C","text":"研发热情"},{"key":"D","text":"研究热情"}],"answer":["B"],"explanation":"**B（技术热情）**\n技术热情的定义即\"努力开发新技术、接受来自技术的挑战的理想\"。注意与\"科研热情\"（面向科学发现）的区别。","note":""},{"id":"3-4","chapter":3,"number":4,"type":"single","stem":"工程职业伦理章程在控制风险方面，不仅要求工程师自我反思，更需要 ______。","options":[{"key":"A","text":"严谨"},{"key":"B","text":"务实"},{"key":"C","text":"技术热情"},{"key":"D","text":"现实的行动"}],"answer":["D"],"explanation":"**D（现实的行动）**\n伦理章程控制风险不能停留在自我反思层面，关键要落实到\"现实的行动\"，即将规范转化为具体行动。可结合本讲\"从反思走向行动\"的思路记忆。","note":""},{"id":"3-5","chapter":3,"number":5,"type":"single","stem":"把 ______ 作为工程职业伦理规范的首要责任原则，是因为它关注的是人类整体和长远利益的发展。","options":[{"key":"A","text":"坚守道德"},{"key":"B","text":"可持续发展"},{"key":"C","text":"持续学习"},{"key":"D","text":"严谨务实"}],"answer":["B"],"explanation":"**B（可持续发展）**\n题干后半句\"关注人类整体和长远利益的发展\"正是可持续发展的核心特征——代际公平、整体利益，故首要责任原则是可持续发展。","note":""},{"id":"3-6","chapter":3,"number":6,"type":"single","stem":"可持续发展把 ______ 纳入伦理调整的范围，通过积极采取\"人为自己立法\"的行动，对工程实施采取有约束力的发展模式。","options":[{"key":"A","text":"人身健康"},{"key":"B","text":"经济发展"},{"key":"C","text":"社会制度"},{"key":"D","text":"自然环境"}],"answer":["D"],"explanation":"**D（自然环境）**\n可持续发展把\"自然环境\"纳入伦理调整范围（传统伦理只调整人与人关系，可持续发展扩展到人与自然），通过\"人为自己立法\"对工程采取有约束力的发展模式。","note":""},{"id":"3-7","chapter":3,"number":7,"type":"single","stem":"工程师面临的第一个冲突是 ______，因为工程师的角色有着复杂的三重性。","options":[{"key":"A","text":"责任冲突"},{"key":"B","text":"伦理冲突"},{"key":"C","text":"技术冲突"},{"key":"D","text":"角色冲突"}],"answer":["D"],"explanation":"**D（角色冲突）**\n工程师角色具有三重性（受雇者、职业共同体成员、公众利益守护者），由此产生的第一个冲突就是角色冲突。","note":""},{"id":"3-8","chapter":3,"number":8,"type":"single","stem":"工程师在工程中是具有特殊地位的，能够在一定程度上协调各主体间的 ______，进而有效地降低工程伦理风险。","options":[{"key":"A","text":"角色冲突"},{"key":"B","text":"伦理冲突"},{"key":"C","text":"利益冲突"},{"key":"D","text":"责任冲突"}],"answer":["C"],"explanation":"**C（利益冲突）**\n工程师的特殊地位使其能协调各主体（业主、公司、公众等）之间的利益冲突，从而降低伦理风险。注意区分：第 7 题问角色三重性产生的\"第一个冲突\"是角色冲突；本题问工程师能\"协调\"的是各主体间的利益冲突。","note":""},{"id":"3-9","chapter":3,"number":9,"type":"multiple","stem":"\"工程师应利用他们的知识和技能增强人类福祉\"，这里的福祉指的是 ______、______、______ 等价值追求。","options":[{"key":"A","text":"健康"},{"key":"B","text":"环境"},{"key":"C","text":"可持续发展"},{"key":"D","text":"生活"}],"answer":["A","B","C"],"explanation":"**ABC（健康、环境、可持续发展）**\n\"人类福祉\"指健康、环境、可持续发展等价值追求（对应工程伦理章程\"公众安全、健康与福祉\"的经典表述），\"生活\"不属于此类价值追求表述。","note":""},{"id":"3-10","chapter":3,"number":10,"type":"multiple","stem":"从内容层面划分，工程师职业伦理责任可分为 ______、______ 和 ______。","options":[{"key":"A","text":"家庭责任"},{"key":"B","text":"组织责任"},{"key":"C","text":"社会责任"},{"key":"D","text":"生态责任"}],"answer":["B","C","D"],"explanation":"**BCD（组织责任、社会责任、生态责任）**\n内容层面三分：对组织（雇主/职业共同体）、对社会（公众）、对生态（自然环境）的责任；\"家庭责任\"不属于工程职业伦理责任的内容划分。","note":""},{"id":"3-11","chapter":3,"number":11,"type":"multiple","stem":"从程度层面划分，工程师职业伦理责任可分为 ______、______ 和 ______。","options":[{"key":"A","text":"底线责任"},{"key":"B","text":"合理关照"},{"key":"C","text":"社会责任"},{"key":"D","text":"\"善举\""}],"answer":["A","B","D"],"explanation":"**ABD（底线责任、合理关照、\"善举\"）**\n程度层面由低到高：底线责任 → 合理关照 → \"善举\"。\"社会责任\"属于内容层面（第 10 题），是干扰项——两题常对照出题，注意区分\"内容层面\"与\"程度层面\"。","note":""},{"id":"3-12","chapter":3,"number":12,"type":"multiple","stem":"工程师职业伦理责任按照指向也可分为：______ 和 ______。","options":[{"key":"A","text":"底线责任"},{"key":"B","text":"前瞻性责任"},{"key":"C","text":"组织责任"},{"key":"D","text":"后续性责任"}],"answer":["B","D"],"explanation":"**BD（前瞻性责任、后续性责任）**\n按指向（时间维度）划分：前瞻性责任（事前预防）与后续性责任（事后承担）。","note":""},{"id":"3-13","chapter":3,"number":13,"type":"multiple","stem":"工程师面临的利益冲突包括 ______、______、______、______ 的利益冲突等。","options":[{"key":"A","text":"工程师团体内部之间"},{"key":"B","text":"工程师个体与公司之间"},{"key":"C","text":"工程师个体和社会公众之间"},{"key":"D","text":"公司与社会公众之间"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n利益冲突覆盖四类主体关系：工程师团体内部、工程师个体与公司、工程师个体与公众、公司与公众，题干四个空对应全部四个选项。","note":""},{"id":"3-14","chapter":3,"number":14,"type":"multiple","stem":"在工程实践中，工程师要 ______、______、______、______。","options":[{"key":"A","text":"按照伦理章程的规范要求遵守职责义务"},{"key":"B","text":"根据当下的工程实际反思和认识实践规范提出的道德要求"},{"key":"C","text":"变通和调整践行责任的行为方式"},{"key":"D","text":"不断探索和总结正确行动的手段和途径"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n工程师践行职业伦理责任是完整链条：遵守章程义务 → 结合实际反思道德要求 → 变通调整行为方式 → 探索总结行动手段。四个空对应全部选项。","note":""},{"id":"3-15","chapter":3,"number":15,"type":"boolean","stem":"工程师需要把握住环境保护的社会目标，注重公众的需求和福祉。（ √ / × ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n环境保护是工程的社会目标之一，工程师须注重公众需求和福祉，表述正确。","note":""},{"id":"3-16","chapter":3,"number":16,"type":"boolean","stem":"对于我国工程师而言，要发扬爱党报国、敬业奉献精神，应具备合格的专业能力，应具有高尚的职业道德情操和工程伦理素养，承担社会责任，维护职业声誉，不断完善自我，追求卓越，用专业知识和技能促进可持续发展，造福人民、造福社会、造福人类，积极推动构建人类命运共同体。（ √ / × ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n这是《中国工程师职业道德规范（试行）》等对我国工程师的总体要求（爱党报国、敬业奉献、可持续发展、人类命运共同体等），表述正确。","note":""},{"id":"3-17","chapter":3,"number":17,"type":"boolean","stem":"工程职业伦理规范的首要责任原则主要有三点：一是对公众的安全要履行义务，坚持生命至上；二是要坚持独立发展；三是忠诚与举报。（ √ / × ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×**\n三点应为：①对公众的安全履行义务、生命至上；②**坚持可持续发展**（而非\"独立发展\"）；③忠诚与举报。\"独立发展\"是偷换概念——结合第 5 题（首要责任原则=可持续发展）即可识别。","note":""},{"id":"3-18","chapter":3,"number":18,"type":"boolean","stem":"\"对公众的安全要履行义务，坚持生命至上\"要求工程师\"将公众的安全、健康和福祉放在首位\"。（ √ / × ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n\"生命至上\"即要求把公众的安全、健康和福祉放在首位（NSPE 章程首要准则的中文表述），正确。","note":""},{"id":"4-1","chapter":4,"number":1,"type":"single","stem":"科学研究规范的作用不包括以下哪一条？","options":[{"key":"A","text":"保障和推动科学研究持续、文明、健康发展"},{"key":"B","text":"防范科学研究中可能出现的失误与偏差"},{"key":"C","text":"增强科学共同体的凝聚力，保障科学共同体的和谐"},{"key":"D","text":"为科学研究创造一个公平、公正、有序的环境"}],"answer":["B"],"explanation":"**B（防范科学研究中可能出现的失误与偏差）**\n科学研究规范针对的是\"行为不端\"，而不是\"失误与偏差\"——失误属于诚实性错误/疏忽，规范的作用是保障健康发展（A）、增强共同体凝聚力与和谐（C）、创造公平公正有序的环境（D），不能防范\"失误\"本身。易错点：很多人会凭直觉选 B 觉得\"防范偏差\"合理，但\"失误与偏差\"恰恰不在规范作用之列。","note":""},{"id":"4-2","chapter":4,"number":2,"type":"single","stem":"科研诚信主要指科技人员在科技活动中弘扬以追求真理、实事求是、______、开放协作为核心的科学精神。","options":[{"key":"A","text":"团结协作"},{"key":"B","text":"锐意进取"},{"key":"C","text":"崇尚创新"},{"key":"D","text":"以上都不对"}],"answer":["C"],"explanation":"**C（崇尚创新）**\n科研诚信的标准表述：弘扬\"追求真理、实事求是、崇尚创新、开放协作\"的科学精神。\"团结协作\"与后面的\"开放协作\"语义重复，是干扰项。","note":""},{"id":"4-3","chapter":4,"number":3,"type":"single","stem":"下列属于科学研究中的故意的错误的是（ ）","options":[{"key":"A","text":"疏忽大意"},{"key":"B","text":"诚实的错误"},{"key":"C","text":"伪造"},{"key":"D","text":"以上都不对"}],"answer":["C"],"explanation":"**C（伪造）**\n科研中的错误分两类：疏忽大意（A）、诚实的错误（B）属于\"非故意的错误\"；伪造、篡改、剽窃才是\"故意的错误\"。","note":""},{"id":"4-4","chapter":4,"number":4,"type":"single","stem":"以下哪种形式不属于伪造和篡改？","options":[{"key":"A","text":"实际没有进行实验，得出研究结论"},{"key":"B","text":"故意取舍数据原始数据，以符合自己期望的研究结论"},{"key":"C","text":"侵犯或损害他人著作权，故意省略参考他人出版物"},{"key":"D","text":"伪造履历、论文等"}],"answer":["C"],"explanation":"**C（侵犯或损害他人著作权，故意省略参考他人出版物）**\nA、B 是伪造/篡改数据，D 是伪造履历论文，都属于伪造和篡改；C 是侵犯著作权（抄袭/剽窃类问题），不属于\"伪造和篡改\"的范畴。","note":""},{"id":"4-5","chapter":4,"number":5,"type":"single","stem":"关于数据与研究的真实性，以下哪一条表述是正确的（ ）","options":[{"key":"A","text":"由于数据失真会影响研究的真实性，在记录数据时应删除那些误差较大的数据"},{"key":"B","text":"由于已经公开发表的成果一般是通过同行评议后发表的，一旦发现捏造篡改数据的情况，应该由科学共同体共同承担相应的责任"},{"key":"C","text":"捏造和篡改数据的研究人员，应该受到包括撤销论文等在内的相应的处罚"},{"key":"D","text":"数据和研究的真实性是相对而言的，只要不被发现，捏造和篡改数据有利于多出成果"}],"answer":["C"],"explanation":"**C（捏造和篡改数据的研究人员，应该受到包括撤销论文等在内的相应的处罚）**\nA 错在\"删除误差较大的数据\"本身就是篡改；B 错在责任应由造假的 researchers 个人承担而非科学共同体；D 是典型的错误价值导向。只有 C 正确——处罚措施包括撤销论文等。","note":""},{"id":"4-6","chapter":4,"number":6,"type":"single","stem":"数据记录应该力求完整，但以下哪条要求一般是不必要的（ ）","options":[{"key":"A","text":"准确记录数据的原始结果"},{"key":"B","text":"记录数据的采集日期"},{"key":"C","text":"记录数据的收集顺序"},{"key":"D","text":"记录采集数据时的心情"}],"answer":["D"],"explanation":"**D（记录采集数据时的心情）**\n完整的数据记录要求记录原始结果、采集日期、收集顺序等客观信息，\"心情\"不属于必要记录项。","note":""},{"id":"4-7","chapter":4,"number":7,"type":"single","stem":"以下行为明显属于篡改的是（ ）","options":[{"key":"A","text":"在研究中有意对原始调查数据或实验数据、图像或图表进行改动、挑选使用或随意增删数据，使其原始性和完整性不能得到准确反映"},{"key":"B","text":"利用他人已发表成果中的创意、研究方法、数据、图像、结果或文字表述而未通过恰当的引注与说明对他人的贡献予以相应的承认"},{"key":"C","text":"在申报课题、进行研究和报告成果等科研的各个环节，捏造实验或调查过程，编造数据、图像、资料、文献或研究成果，并将其报告或发表"},{"key":"D","text":"未经许可使用他人未发表的成果或重要学术观点"}],"answer":["A"],"explanation":"**A（有意改动、挑选使用或随意增删原始数据/图像/图表）**\n篡改（falsification）的定义就是改动、挑选、增删原始数据使其失真。B 是剽窃（未恰当引注），C 是伪造（捏造过程、编造数据），D 是侵犯未发表成果。注意区分：伪造=\"无中生有\"，篡改=\"有中改动\"。","note":""},{"id":"4-8","chapter":4,"number":8,"type":"single","stem":"国家标准和行业标准又分为强制性标准和（ ）","options":[{"key":"A","text":"普通标准"},{"key":"B","text":"推荐性标准"},{"key":"C","text":"最高标准"},{"key":"D","text":"企业标准"}],"answer":["B"],"explanation":"**B（推荐性标准）**\n《标准化法》：国家标准、行业标准分为强制性标准和推荐性标准。","note":""},{"id":"4-9","chapter":4,"number":9,"type":"single","stem":"在我国标准体系中，从标准水平上看，______ 应该占据绝对优势。","options":[{"key":"A","text":"国家标准"},{"key":"B","text":"行业标准"},{"key":"C","text":"地方标准"},{"key":"D","text":"企业标准"}],"answer":["D"],"explanation":"**D（企业标准）**\n从标准水平上看，企业标准的技术要求应当（应该）高于国家标准、行业标准，故在水平上\"企业标准应占据绝对优势\"。易错点：直觉上容易选\"国家标准\"，但题目问的是\"标准水平\"而非\"法律效力层级\"。","note":""},{"id":"4-10","chapter":4,"number":10,"type":"multiple","stem":"下列各项中，常见的科研不端行为有哪些？","options":[{"key":"A","text":"伪造"},{"key":"B","text":"篡改"},{"key":"C","text":"抄袭"},{"key":"D","text":"引用"}],"answer":["A","B","C"],"explanation":"**ABC（伪造、篡改、抄袭）**\n国际公认的 FFP 三大科研不端行为：伪造（Fabrication）、篡改（Falsification）、剽窃/抄袭（Plagiarism）。\"引用\"只要规范进行就是正当的学术行为。","note":""},{"id":"4-11","chapter":4,"number":11,"type":"multiple","stem":"下列各项中，属于伪造和篡改的常见表现形式的是（ ）","options":[{"key":"A","text":"伪造试验样品、论文材料与方法"},{"key":"B","text":"伪造和篡改实验数据，伪造虚假的观察与实验结果"},{"key":"C","text":"取舍数据和篡改原始数据"},{"key":"D","text":"伪造履历"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n伪造和篡改的常见表现形式涵盖：伪造试验样品与论文材料方法、伪造篡改实验数据与观察结果、取舍数据和篡改原始数据、伪造履历，四项均属。","note":""},{"id":"4-12","chapter":4,"number":12,"type":"multiple","stem":"下列行为不符合科学研究规范的是？","options":[{"key":"A","text":"实验结果不理想，删掉记录，重来"},{"key":"B","text":"实验结果不理想，改一下，这样不错"},{"key":"C","text":"太难做了，终于成功一次，给导师说了做了10次，全部成功"},{"key":"D","text":"没时间做实验了，伪造大法好"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\nA 删掉记录重来=销毁/篡改原始记录；B 改数据=篡改；C 把一次成功说成十次全成功=伪造；D 直接伪造数据。四项全部不符合科学研究规范。","note":""},{"id":"4-13","chapter":4,"number":13,"type":"multiple","stem":"如何理解伪造研究数据？（ ）","options":[{"key":"A","text":"伪造数据是很多学科（尤其是理工科）中相当突出的一项学术不端行为"},{"key":"B","text":"研究数据是形成科学研究结论的重要基础，研究结果的可靠性依赖于研究数据的真实、可信"},{"key":"C","text":"舍恩学术丑闻事件是典型的数据造假的案例"},{"key":"D","text":"对于科研数据、资料、文献、注释进行伪造，或者捏造事实、编造虚假研究成果均为学术不诚实、不诚信的体现，均应纳入到学术不端行为的范畴"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n四项从不同角度阐述伪造研究数据的性质：理工科突出的不端行为、数据真实性是结论可靠性的基础、舍恩（Schön）事件是典型数据造假案例、伪造数据/资料/文献/注释均属学术不端。","note":""},{"id":"4-14","chapter":4,"number":14,"type":"multiple","stem":"科技工作者的基本学术规范包括（ ）","options":[{"key":"A","text":"遵纪守法，弘扬科学精神"},{"key":"B","text":"严谨治学，反对浮躁作风"},{"key":"C","text":"公开、公正，开展公平竞争"},{"key":"D","text":"相互尊重，发扬学术民主"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n《科技工作者科学道德规范》等规定的科技工作者基本学术规范：遵纪守法弘扬科学精神、严谨治学反对浮躁、公开公正公平竞争、相互尊重发扬学术民主，四项全选。","note":""},{"id":"4-15","chapter":4,"number":15,"type":"multiple","stem":"下列属于科学研究故意的错误的有（ ）","options":[{"key":"A","text":"篡改"},{"key":"B","text":"伪造"},{"key":"C","text":"剽窃"},{"key":"D","text":"疏忽大意"}],"answer":["A","B","C"],"explanation":"**ABC（篡改、伪造、剽窃）**\n与第 3 题对应：故意的错误=伪造、篡改、剽窃（FFP）；\"疏忽大意\"（D）属于非故意的错误，是干扰项。","note":""},{"id":"4-16","chapter":4,"number":16,"type":"multiple","stem":"中国标准分为（ ）四级","options":[{"key":"A","text":"国家标准"},{"key":"B","text":"行业标准"},{"key":"C","text":"地方标准"},{"key":"D","text":"企业标准"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n《标准化法》：我国标准分为国家标准、行业标准、地方标准、企业标准四级。","note":""},{"id":"4-17","chapter":4,"number":17,"type":"multiple","stem":"下列各项中，属于强制性标准的有（ ）","options":[{"key":"A","text":"卫生标准"},{"key":"B","text":"兽药标准"},{"key":"C","text":"食品卫生标准"},{"key":"D","text":"药品标准"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n强制性标准是保障人体健康、人身财产安全的标准和法律行政法规规定强制执行的标准：药品标准、食品卫生标准、兽药标准、卫生标准均属强制性标准。","note":""},{"id":"4-18","chapter":4,"number":18,"type":"multiple","stem":"工程设计通常是一个用到技术和科学知识的系统化过程，在这个过程中，某些功能转化为可以满足这些功能的成品、系统，或者服务的蓝图。设计过程可以分解为问题分析和制定、概念设计、（ ）","options":[{"key":"A","text":"模拟"},{"key":"B","text":"决策"},{"key":"C","text":"细节设计"},{"key":"D","text":"模型建立和测试"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n工程设计过程的分解：问题分析和制定 → 概念设计 → 决策 → 细节设计 → 模拟 → 模型建立和测试。题干留空部分对应\"决策、细节设计、模拟、模型建立和测试\"等后续环节，四个选项均包括在完整分解流程中。","note":""},{"id":"4-19","chapter":4,"number":19,"type":"multiple","stem":"在数据收集、使用和管理上，高质量和负责任的研究要求研究者在数据收集时把握哪些原则？（ ）","options":[{"key":"A","text":"方法得当，适当地设计试验或选用数据采集方法，以获得真实、完整的研究数据"},{"key":"B","text":"注重细节，详细、准确地记录研究过程，易于核对检查；不得涂改实验数据，不得销毁试验记录的任何部分"},{"key":"C","text":"获得许可，一些特定数据的收集需要获得授权或者取得数据提供者的知情同意"},{"key":"D","text":"完整记录，准确无误记录数据的采集日期、收集顺序、原始结果"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n负责任的研究在数据收集上的原则：方法得当（A）、注重细节（B）、获得许可（C）、完整记录（D），四项全部正确。","note":""},{"id":"4-20","chapter":4,"number":20,"type":"boolean","stem":"科学共同体是科学研究活动的责任主体，既是科研成果的创造者和评价者，也是科学规范的制定者和执行者。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n科学共同体既是科研成果的创造者和评价者，也是科学规范的制定者和执行者，是科研活动的责任主体，表述正确。","note":""},{"id":"4-21","chapter":4,"number":21,"type":"boolean","stem":"科学是单纯的追求知识的事业，完全不用考虑这些知识对社会和人类有什么正面或负面的价值。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×**\n科学不是价值中立的单纯求知事业，必须考虑知识对社会和人类的正面或负面价值（这正是科研伦理/责任伦理的核心立场）。","note":""},{"id":"4-22","chapter":4,"number":22,"type":"boolean","stem":"科研活动中的伪造行为既违背科学精神，破坏科学共同体的声誉，也会误导同行和研究结果的其他使用者，甚至给他们造成损失和伤害，这显然有悖科研人员的职业道德。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n伪造行为违背科学精神、损害共同体声誉、误导同行并可能造成损失和伤害，有悖科研人员职业道德，表述正确。","note":""},{"id":"4-23","chapter":4,"number":23,"type":"boolean","stem":"科学研究应该严谨，即科研人员应认真负责地开展研究，避免因粗心大意或一时疏忽而造成差错。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n严谨性要求科研人员认真负责地开展研究，避免因粗心大意或疏忽造成差错，表述正确。","note":""},{"id":"5-1","chapter":5,"number":1,"type":"single","stem":"工程伦理不完全适用于中国工程实践的原因不包括（ ）","options":[{"key":"A","text":"中国的工程师职业自治权力较小"},{"key":"B","text":"中国实践中的工程管理者对工程活动的参与不足"},{"key":"C","text":"工程管理者在中国实践的工程管理过程中处于核心地位"},{"key":"D","text":"工程伦理对工程师的高责任要求与中国实践中他们的低影响力水平不匹配"}],"answer":["B"],"explanation":"**B（工程管理者对工程活动的参与不足）**\n工程伦理不完全适用于中国实践的原因在于：中国工程师职业自治权力较小（A）、工程管理者在管理过程中处于核心地位（C）、高责任要求与低影响力不匹配（D）。B 说反了——中国实践中工程管理者参与恰恰很多（处于核心地位），\"参与不足\"不是原因。","note":""},{"id":"5-2","chapter":5,"number":2,"type":"single","stem":"下列与短期与长期价值选择最相关的场景是（ ）","options":[{"key":"A","text":"为个人私利而在材料购买中\"吃回扣\""},{"key":"B","text":"在赶工期间省略脚手架的安全验收"},{"key":"C","text":"承接信誉不佳的工程项目来提升公司业绩"},{"key":"D","text":"预算紧张时不做环保措施"}],"answer":["C"],"explanation":"**C（承接信誉不佳的工程项目来提升公司业绩）**\n\"短期与长期价值选择\"的典型场景：为短期业绩承接信誉不佳的项目，牺牲的是长期声誉与价值。A 是廉洁/利益冲突问题，B 是安全与进度冲突，D 是成本与环境冲突。","note":""},{"id":"5-3","chapter":5,"number":3,"type":"single","stem":"伦理失范行为的成因主要是哪个决策环节的失效（ ）","options":[{"key":"A","text":"伦理意识"},{"key":"B","text":"伦理实施"},{"key":"C","text":"伦理动机"},{"key":"D","text":"全部"}],"answer":["D"],"explanation":"**D（全部）**\n伦理失范的成因可出现在伦理决策的各个环节（意识、判断、动机、实施），第 4–6 题就是各环节失效的具体例子，故\"全部\"。","note":""},{"id":"5-4","chapter":5,"number":4,"type":"single","stem":"施工单位的管理者认为缩短工期存在风险，但在建设单位的压力下还是同意了这个要求，这反映了哪个伦理决策阶段的失效（ ）","options":[{"key":"A","text":"伦理意识"},{"key":"B","text":"伦理判断"},{"key":"C","text":"伦理动机"},{"key":"D","text":"伦理实施"}],"answer":["D"],"explanation":"**D（伦理实施）**\n管理者已意识到风险（意识在）、也判断出有风险（判断在），但在建设单位外部压力下仍同意——即未能把正确的伦理判断落实为行动，失效在\"实施\"环节。对照：第 5 题失效在判断、第 6 题失效在动机，三题是一组对照题。","note":""},{"id":"5-5","chapter":5,"number":5,"type":"single","stem":"管理者认为压缩工期可以尽早交工，不是件坏事，这反映了哪个伦理决策阶段的失效（ ）","options":[{"key":"A","text":"伦理意识"},{"key":"B","text":"伦理判断"},{"key":"C","text":"伦理动机"},{"key":"D","text":"伦理实施"}],"answer":["B"],"explanation":"**B（伦理判断）**\n\"压缩工期可以尽早交工，不是件坏事\"——管理者根本没认识到其中的伦理/安全问题，对行为性质作出了错误评价，失效在\"判断\"环节（把有风险的事判断为\"不是坏事\"）。","note":""},{"id":"5-6","chapter":5,"number":6,"type":"single","stem":"尽管压缩工期会增加安全风险，但为了节省成本和及时交工，管理者还是决定压缩工期，这反映了哪个伦理决策阶段的失效（ ）","options":[{"key":"A","text":"伦理意识"},{"key":"B","text":"伦理判断"},{"key":"C","text":"伦理动机"},{"key":"D","text":"伦理实施"}],"answer":["C"],"explanation":"**C（伦理动机）**\n明知增加安全风险（意识、判断都在），但为了节省成本和及时交工仍决定压缩——在价值排序上把成本/进度置于安全之上，缺乏把伦理价值置于优先地位的动机，失效在\"动机\"环节。","note":""},{"id":"5-7","chapter":5,"number":7,"type":"single","stem":"在应急状态下，支持管理者快速做出伦理判断的能力是（ ）","options":[{"key":"A","text":"道德认识能力"},{"key":"B","text":"道德创造能力"},{"key":"C","text":"道德直觉能力"},{"key":"D","text":"道德践履能力"}],"answer":["C"],"explanation":"**C（道德直觉能力）**\n应急状态下没有时间做系统的道德推理，支持快速伦理判断的是道德直觉能力。认识能力偏认知、创造能力偏新规范建构、践履能力偏行动落实。","note":""},{"id":"5-8","chapter":5,"number":8,"type":"multiple","stem":"高质量发展背景下，一个\"好\"的工程的特点有哪些？（ ）","options":[{"key":"A","text":"保障建筑质量"},{"key":"B","text":"增进经济效益"},{"key":"C","text":"彰显人文关怀"},{"key":"D","text":"减少资源消耗"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n高质量发展背景下\"好\"的工程：保障建筑质量、增进经济效益、彰显人文关怀、减少资源消耗，四项都是\"好工程\"的特点。","note":""},{"id":"5-9","chapter":5,"number":9,"type":"multiple","stem":"以下对伦理的理解中，正确的是（ ）","options":[{"key":"A","text":"伦理相较于法律是更高层次的规范"},{"key":"B","text":"伦理探讨的是关于\"善\"的问题"},{"key":"C","text":"伦理能够取代技术与经济方法"},{"key":"D","text":"伦理是处理人与人、人与自然关系应遵循的规则"}],"answer":["A","B","D"],"explanation":"**ABD**\n伦理是比法律更高层次的规范（A）、探讨\"善\"的问题（B）、是处理人与人及人与自然关系的规则（D）。C 错——伦理不能取代技术与经济方法，三者互补。","note":""},{"id":"5-10","chapter":5,"number":10,"type":"multiple","stem":"工程管理伦理与工程伦理的区别有（ ）","options":[{"key":"A","text":"工程伦理只适用于西方，工程管理伦理只适用于中国"},{"key":"B","text":"工程伦理以工程师为核心主体，工程管理伦理以工程管理者为核心主体"},{"key":"C","text":"工程管理伦理"},{"key":"D","text":"工程伦理关注技术过程，工程管理伦理关注管理过程"}],"answer":["B","D"],"explanation":"**BD**\n两者区别：核心主体不同（工程师 vs 工程管理者，B）、关注过程不同（技术过程 vs 管理过程，D）。A 错在\"只适用于西方/中国\"的地域论；C 选项页面显示不全且本身不构成\"区别\"表述。","note":""},{"id":"5-11","chapter":5,"number":11,"type":"multiple","stem":"将人的安全、健康与福祉置于首位的原则中，对象包括（ ）","options":[{"key":"A","text":"最终用户"},{"key":"B","text":"从业人员"},{"key":"C","text":"相关社会公众"},{"key":"D","text":"其他与工程利益相关的人"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n\"将人的安全、健康与福祉置于首位\"的对象覆盖全部利益相关者：最终用户、从业人员、相关社会公众、其他与工程利益相关的人。","note":""},{"id":"5-12","chapter":5,"number":12,"type":"multiple","stem":"属于\"职业维度\"的工程管理伦理问题包括（ ）","options":[{"key":"A","text":"发包方对所发包工程任务\"一包了之\"，不再进行管理"},{"key":"B","text":"无资质或低资质的管理者个人借用他人资质"},{"key":"C","text":"因私人事务、个人情绪、不良嗜好等影响正常管理活动"},{"key":"D","text":"未能及时发现与纠正工程活动中的问题和风险"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n职业维度指向管理者自身的职业操守与履职：一包了之不再管理、借用他人资质、私人事务/情绪/嗜好影响管理、未能及时发现纠正问题与风险，四项均属。","note":""},{"id":"5-13","chapter":5,"number":13,"type":"multiple","stem":"属于\"组织维度\"的工程管理伦理问题包括（ ）","options":[{"key":"A","text":"隐瞒与掩盖工程建设中的安全问题或安全事故"},{"key":"B","text":"泄露工程招标的相关信息"},{"key":"C","text":"薪酬待遇方面未能同工同酬，按劳分配"},{"key":"D","text":"不合理地延长劳动时间，不能保证正常的休息时间"}],"answer":["A","C","D"],"explanation":"**ACD（隐瞒安全事故、薪酬不同工同酬、不合理延长劳动时间）**\n组织维度指向组织内部对成员与事实的责任：隐瞒掩盖安全问题/事故（A）、薪酬待遇不公（C）、不合理延长劳动时间（D）。B\"泄露招标信息\"属于招投标/工程维度的问题，不在组织维度。","note":""},{"id":"5-14","chapter":5,"number":14,"type":"multiple","stem":"属于\"社会维度\"的工程管理伦理问题包括（ ）","options":[{"key":"A","text":"未能遵照约定提供相应的人、机、料等资源和管理支持"},{"key":"B","text":"工程施工对道路的占用妨碍公众出行便利"},{"key":"C","text":"在法律界定模糊的灰色地带开展工程管理活动"},{"key":"D","text":"忽视公众的意愿与诉求，以强制手段开展工程建设"}],"answer":["B","C","D"],"explanation":"**BCD（占用道路妨碍公众、灰色地带开展管理、强制手段忽视公众诉求）**\n社会维度指向工程管理与公众/社会的关系：妨碍公众出行（B）、法律灰色地带（C）、忽视公众意愿强制建设（D）。A\"未按约定提供人机料资源和管理支持\"属于组织/合同内部问题，不在社会维度。","note":""},{"id":"5-15","chapter":5,"number":15,"type":"multiple","stem":"属于\"环境维度\"的工程管理伦理问题包括（ ）","options":[{"key":"A","text":"工程建设占地对古建筑等历史文物的拆除改造"},{"key":"B","text":"不能为工程从业人员提供保险与体检等健康风险预防措施"},{"key":"C","text":"建筑物在正常使用年限内被拆除，频繁拆建"},{"key":"D","text":"未能使建筑材料、生产生活资源得到充分利用"}],"answer":["A","C","D"],"explanation":"**ACD（拆除古建筑、正常使用年限内频繁拆建、资源未充分利用）**\n环境维度指向工程与自然/资源/历史环境：拆除改造历史文物（A）、频繁拆建浪费（C）、材料资源未充分利用（D）。B\"不能为从业人员提供保险与体检\"是对人的组织责任，属组织维度。","note":""},{"id":"5-16","chapter":5,"number":16,"type":"multiple","stem":"属于\"工程维度\"的工程管理伦理问题包括（ ）","options":[{"key":"A","text":"不合理地压缩、省略或颠倒施工工序流程"},{"key":"B","text":"投标方与招标方串通以谋取中标机会"},{"key":"C","text":"缺乏对新技术、工艺、材料质量与安全的长期性考量与检验"},{"key":"D","text":"索要超出约定的工程款项"}],"answer":["A","C"],"explanation":"**AC（压缩省略颠倒工序、缺乏对新技术工艺材料的长期考量）**\n工程维度指向工程本体（技术过程）的质量与安全：工序流程被不合理压缩/省略/颠倒（A）、缺乏长期性质量与安全考量（C）。B 串通投标属招投标/职业维度，D 索要超约定款项属经济/职业维度。","note":""},{"id":"5-17","chapter":5,"number":17,"type":"multiple","stem":"提升工程管理伦理水平的方法有（ ）","options":[{"key":"A","text":"建立工程管理伦理指南"},{"key":"B","text":"培养工程管理者的道德能力"},{"key":"C","text":"发展与工程管理伦理指南实施的管理机制"},{"key":"D","text":"识别与解决工程管理伦理问题"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n提升路径是完整闭环：建立伦理指南（A）→ 培养道德能力（B）→ 发展指南实施的管理机制（C）→ 识别与解决伦理问题（D）。","note":""},{"id":"5-18","chapter":5,"number":18,"type":"boolean","stem":"招投标阶段\"走关系\"在工程领域普遍存在，不涉及到价值判断。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×**\n招投标\"走关系\"本身就是违背公平竞争的价值选择，必然涉及价值判断；\"普遍存在\"也不能推出\"不涉及价值判断\"。","note":""},{"id":"5-19","chapter":5,"number":19,"type":"boolean","stem":"公众属于工程环境中的行动主体。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×**\n工程环境中的行动主体是从事工程活动的工程师、管理者等；公众是受工程影响的利益相关者/受影响主体，不属于\"行动主体\"。","note":""},{"id":"5-20","chapter":5,"number":20,"type":"boolean","stem":"伦理所反映的价值选择问题，往往是许多工程问题的根本原因。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n许多工程问题（安全、环境、腐败等）的根源是价值选择问题，这正是伦理分析切入工程问题的理由，表述正确。","note":""},{"id":"6-1","chapter":6,"number":1,"type":"single","stem":"在人类的社会生活中,人们只有借助____才能交往和沟通,进而创造文化本身。","options":[{"key":"A","text":"语言符号和非语言符号"},{"key":"B","text":"规范体系"},{"key":"C","text":"家庭"},{"key":"D","text":"物质产品"}],"answer":["A"],"explanation":"**A（语言符号和非语言符号）**\n人们借助语言符号和非语言符号才能交往沟通、进而创造文化本身；规范体系、家庭、物质产品都是文化的要素，但不是交往沟通的媒介。","note":""},{"id":"6-2","chapter":6,"number":2,"type":"single","stem":"下列各项中,不属于文化内涵的是()","options":[{"key":"A","text":"物质文化"},{"key":"B","text":"制度文化"},{"key":"C","text":"文化程度"},{"key":"D","text":"精神文化"}],"answer":["C"],"explanation":"**C（文化程度）**\n文化内涵的三个层面是物质文化、制度文化、精神文化；\"文化程度\"指个体受教育水平，不属于文化内涵。","note":""},{"id":"6-3","chapter":6,"number":3,"type":"single","stem":"文化____,指的是经过人类干涉或改造的自然环境和创造出来的一切物品。","options":[{"key":"A","text":"历史"},{"key":"B","text":"地理环境"},{"key":"C","text":"规范体系"},{"key":"D","text":"物质产品"}],"answer":["D"],"explanation":"**D（物质产品）**\n\"经过人类干涉或改造的自然环境和创造出来的一切物品\"即文化的物质产品，与判断第 22 题互为印证。","note":""},{"id":"6-4","chapter":6,"number":4,"type":"single","stem":"被称为系统研究跨文化传播活动第一人的是()","options":[{"key":"A","text":"托马斯·爱迪生"},{"key":"B","text":"爱德华·霍尔"},{"key":"C","text":"本贾尼·斯特劳斯特卢普"},{"key":"D","text":"乔治·斯蒂芬森"}],"answer":["B"],"explanation":"**B（爱德华·霍尔）**\n爱德华·霍尔被称为系统研究跨文化传播活动的第一人（高语境/低语境文化）；其余三项为发明家、程序员等干扰项。","note":""},{"id":"6-5","chapter":6,"number":5,"type":"single","stem":"在霍夫施泰德的文化维度理论中,人们用来抵抗来自其他社会成员的不确定性的方法不包括_____。","options":[{"key":"A","text":"科技"},{"key":"B","text":"宗教"},{"key":"C","text":"法律"},{"key":"D","text":"规则"}],"answer":["D"],"explanation":"**D（规则）**\n答案源为 D。注意本题与通行理解有张力（通行表述为\"科技抵抗来自自然的不确定性、宗教/法律/规则抵抗来自社会成员的不确定性\"，若按此应选 A）；本课程答案源给 D，即课程列举中\"规则\"不在其列，对答案时以课件/答案源为准，详见易错点。","note":"原资料提示：参考答案 D 与通行理解存在差异，请结合课件核对。"},{"id":"6-6","chapter":6,"number":6,"type":"single","stem":"\"本土国和东道国选址中的双重标准\"属于工程实践全球化伦理议题中的()","options":[{"key":"A","text":"产业转移议题"},{"key":"B","text":"文化、宗教、习俗冲突议题"},{"key":"C","text":"工程相关标准与条件冲突议题"},{"key":"D","text":"自然风险议题"}],"answer":["A"],"explanation":"**A（产业转移议题）**\n本土国与东道国选址中的双重标准（本土国高标、东道国低标，如博帕尔毒气泄漏案）属于产业转移议题；\"工程相关标准与条件冲突\"指各国工程技术标准、认证条件之间的冲突本身，勿混。","note":""},{"id":"6-7","chapter":6,"number":7,"type":"single","stem":"从一定程度上,曹德旺等跨国工厂存在的矛盾能够被____有效规避。","options":[{"key":"A","text":"道德准则"},{"key":"B","text":"工程伦理的跨文化规范"},{"key":"C","text":"东道国的法律法规"},{"key":"D","text":"本土国的法律法规"}],"answer":["B"],"explanation":"**B（工程伦理的跨文化规范）**\n本讲主线：跨国工厂（如曹德旺赴美设厂）存在的矛盾可由工程伦理的跨文化规范有效规避；道德准则过泛，单靠本土国或东道国法律都不能覆盖跨文化冲突。","note":""},{"id":"6-8","chapter":6,"number":8,"type":"multiple","stem":"下列各项中,属于工程中文化功能的有()","options":[{"key":"A","text":"整合"},{"key":"B","text":"导向"},{"key":"C","text":"维持秩序"},{"key":"D","text":"传续"}],"answer":["A","B","C","D"],"explanation":"**ABCD（整合、导向、维持秩序、传续）**\n文化中功能的四项：整合、导向、维持秩序、传续，全选。","note":""},{"id":"6-9","chapter":6,"number":9,"type":"multiple","stem":"下列各项中,属于社会规范的有()","options":[{"key":"A","text":"科学研究的原理,如牛顿运动定律"},{"key":"B","text":"明文规定的准则,如法律、制度"},{"key":"C","text":"约定俗成的准则,如习俗、道德"},{"key":"D","text":"个体特定的喜好,如饮食习惯"}],"answer":["B","C"],"explanation":"**BC（明文规定的准则、约定俗成的准则）**\n社会规范＝明文规定的准则（法律、制度）＋约定俗成的准则（习俗、道德）；A 科学原理是对自然规律的描述而非行为规范，D 个体喜好不具社会约束力。","note":""},{"id":"6-10","chapter":6,"number":10,"type":"multiple","stem":"下列选项中,属于社会组织的有()","options":[{"key":"A","text":"家庭"},{"key":"B","text":"生产组织"},{"key":"C","text":"教育组织"},{"key":"D","text":"政治组织"}],"answer":["A","B","C","D"],"explanation":"**ABCD（家庭、生产组织、教育组织、政治组织）**\n家庭是最基本的社会组织，生产、教育、政治组织均属社会组织，全选。","note":""},{"id":"6-11","chapter":6,"number":11,"type":"multiple","stem":"下列选项中,属于霍夫斯泰德的文化维度理论中文化差异基本维度的有()","options":[{"key":"A","text":"个体主义/集体主义"},{"key":"B","text":"权利距离"},{"key":"C","text":"男性化社会/女性化社会"},{"key":"D","text":"不确定性规避"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n霍夫斯泰德文化差异基本维度：个体主义/集体主义、权利距离（权力距离）、男性化/女性化、不确定性规避。本题选项顺序与教材列举顺序不同，但四项皆为基本维度。","note":""},{"id":"6-12","chapter":6,"number":12,"type":"multiple","stem":"工程实践的全球化特征主要表现为()","options":[{"key":"A","text":"局限性"},{"key":"B","text":"生态性"},{"key":"C","text":"整体性"},{"key":"D","text":"深远性"}],"answer":["B","C","D"],"explanation":"**BCD（生态性、整体性、深远性）**\n工程实践全球化特征表现为生态性、整体性、深远性；\"局限性\"与全球化语义相反，为干扰项。","note":""},{"id":"6-13","chapter":6,"number":13,"type":"multiple","stem":"下列选项中,属于工程实践全球化中工程师的多重责任的有()","options":[{"key":"A","text":"职业伦理责任"},{"key":"B","text":"社会伦理责任"},{"key":"C","text":"环境伦理责任"},{"key":"D","text":"文化伦理责任"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n全球化背景下工程师的多重责任：职业伦理、社会伦理、环境伦理、文化伦理四重责任。","note":""},{"id":"6-14","chapter":6,"number":14,"type":"multiple","stem":"应对跨文化工程伦理冲突的立场有()","options":[{"key":"A","text":"伦理相对主义"},{"key":"B","text":"理性主义"},{"key":"C","text":"伦理绝对主义"},{"key":"D","text":"伦理关联主义"}],"answer":["A","C","D"],"explanation":"**ACD（伦理相对主义、伦理绝对主义、伦理关联主义）**\n应对跨文化工程伦理冲突的三种立场为相对主义、绝对主义、关联主义（关联主义为课程主张的立场）；\"理性主义\"为干扰项。","note":""},{"id":"6-15","chapter":6,"number":15,"type":"multiple","stem":"下列选项中,属于跨文化规范辨识来源的有()","options":[{"key":"A","text":"古代的宗教和伦理著作"},{"key":"B","text":"近代以来确立的基本伦理模型"},{"key":"C","text":"关于普遍人权的国际文献"},{"key":"D","text":"国际工程社团的伦理章程"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n跨文化规范辨识的四个来源：古代的宗教和伦理著作、近代以来确立的基本伦理模型、关于普遍人权的国际文献、国际工程社团的伦理章程。","note":""},{"id":"6-16","chapter":6,"number":16,"type":"multiple","stem":"以下各国的工程职业伦理章程匹配正确的有()","options":[{"key":"A","text":"美国《社会责任国际标准》"},{"key":"B","text":"中国《中国工程师信条》"},{"key":"C","text":"日本《全球契约》"},{"key":"D","text":"法国《工程伦理宪章》"}],"answer":["B","D"],"explanation":"**BD（中国《中国工程师信条》、法国《工程伦理宪章》）**\n正确匹配仅 B、D；A《社会责任国际标准》（SA8000 一类社会责任标准）并非美国工程职业伦理章程，C《全球契约》为联合国全球契约而非日本章程，均属张冠李戴。","note":""},{"id":"6-17","chapter":6,"number":17,"type":"multiple","stem":"下列选项中,属于跨文化工程伦理规范的有()","options":[{"key":"A","text":"避免剥削"},{"key":"B","text":"避免侵犯人权"},{"key":"C","text":"保护东道国公民的健康和安全"},{"key":"D","text":"保护东道国的自然环境"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n跨文化工程伦理规范四条：避免剥削、避免侵犯人权、保护东道国公民的健康和安全、保护东道国的自然环境。","note":""},{"id":"6-18","chapter":6,"number":18,"type":"boolean","stem":"回避程度低的文化通过规章制度、安全措施以及对于绝对真理的信仰尽力回避各种不确定因素。()","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×**\n题干描述的是回避程度\"高\"的文化特征（靠规章制度、安全措施、绝对真理信仰回避不确定因素）；回避程度低的文化对不确定性容忍度较高。","note":""},{"id":"6-19","chapter":6,"number":19,"type":"boolean","stem":"文化以彰显意义为重。()","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n文化以彰显意义为重，表述正确。","note":""},{"id":"6-20","chapter":6,"number":20,"type":"boolean","stem":"文化的要素包括规范体系、语言和非语言符号系统、社会组织与家庭、历史、物质产品、地理环境等。()","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n文化要素列举完整：规范体系、语言和非语言符号系统、社会组织与家庭、历史、物质产品、地理环境，与单选第 1–3 题呼应。","note":""},{"id":"6-21","chapter":6,"number":21,"type":"boolean","stem":"文化可以被认为是个体的思维特征。()","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×**\n文化是群体（集体）的思维与行为特征，不是个体特征；个体层面属人格/个性范畴。","note":""},{"id":"6-22","chapter":6,"number":22,"type":"boolean","stem":"文化的物质产品,指的是经过人类干涉或改造的自然环境和创造出来的一切物品。()","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n与单选第 3 题正确选项 D 的定义一致，表述正确。","note":""},{"id":"7-1","chapter":7,"number":1,"type":"single","stem":"1955年,钱学森离开美国踏上归国旅程,临行前,他回答前来采访的美国记者时说:\"我不打算要回来,我想尽我最大的努力,来协助中国人民建设一个能令他们活得____的国家。\"","options":[{"key":"A","text":"幸福而有尊严"},{"key":"B","text":"平等而有自由"},{"key":"C","text":"富强而有民主"}],"answer":["A"],"explanation":"**A（幸福而有尊严）**\n钱学森归国前的原话为\"协助中国人民建设一个能令他们活得幸福而有尊严的国家\"。","note":""},{"id":"7-2","chapter":7,"number":2,"type":"single","stem":"他在日记里这样写道:纵使世界给我珍宝和荣誉,我也不愿离开我的祖国。纵使我的祖国在耻辱中,我还是喜欢、热爱、祝福我的祖国!他是 ____?","options":[{"key":"A","text":"钱学森"},{"key":"B","text":"黄纬禄"},{"key":"C","text":"孙家栋"}],"answer":["B"],"explanation":"**B（黄纬禄）**\n日记名言\"纵使世界给我珍宝和荣誉……\"出自黄纬禄；注意与第 1 题的钱学森、干扰项孙家栋区分。","note":""},{"id":"7-3","chapter":7,"number":3,"type":"single","stem":"下列航天任务中,最初孕育并形成\"四共同\"原则的是____","options":[{"key":"A","text":"嫦娥一号发射"},{"key":"B","text":"天宫一号对接"},{"key":"C","text":"长征系列运载火箭发射"},{"key":"D","text":"巨浪一号研制"}],"answer":["D"],"explanation":"**D（巨浪一号研制）**\n\"四共同\"原则最初孕育并形成于巨浪一号研制过程。","note":""},{"id":"7-4","chapter":7,"number":4,"type":"single","stem":"\"四共同\"原则在航天事业发展中的具体体现是____","options":[{"key":"A","text":"做好自己,不管他人"},{"key":"B","text":"遇到困难问题直接上交"},{"key":"C","text":"遇到问题困难风险,各自拿出余量,一起协同解决。"},{"key":"D","text":"对短板和弱项,不去帮助,不顾进度,逼其独立面对,促其尽快成长。"}],"answer":["C"],"explanation":"**C**\n\"四共同\"的具体体现是遇到问题困难风险时各自拿出余量、一起协同解决；A（不管他人）、B（直接上交）、D（逼其独立面对）均为反面描述。","note":""},{"id":"7-5","chapter":7,"number":5,"type":"single","stem":"80年代初期,\"巨浪一号\"试验首发失利,经过六天多时间的归零,黄纬禄果断决策进行第二发发射,最终取得圆满成功,从而使得我国真正形成了____","options":[{"key":"A","text":"首次核打击能力"},{"key":"B","text":"二次核打击能力"},{"key":"C","text":"\"三位一体\"战略核打击能力。"}],"answer":["B"],"explanation":"**B（二次核打击能力）**\n潜射导弹\"巨浪一号\"的成功使我国真正形成二次核打击能力；\"首次核打击\"与\"三位一体\"均不准确。","note":""},{"id":"7-6","chapter":7,"number":6,"type":"single","stem":"在2000年9月1日,中国资源二号01星发射升空,当时,卫星绕地球运行顺利,数据显示传输通畅。就在叶培建从发射基地赶往机场时,他突然接到电话:卫星进入第二圈突然失去姿态,原因不明。也就是说,卫星飞了两圈后没信号了,卫星\"丢\"了。找回来了吗?____","options":[{"key":"A","text":"找回来了"},{"key":"B","text":"没有找回来"}],"answer":["A"],"explanation":"**A（找回来了）**\n资源二号01星\"丢星\"后，叶培建团队最终把卫星找了回来（姿态恢复、任务挽救）。","note":""},{"id":"7-7","chapter":7,"number":7,"type":"single","stem":"在新闻\"奥运火,航天心\"中,奥运火炬研制之初,考虑到奥运火炬要从海拔8300米的突击营地登上珠峰峰顶,大约需要7到8个小时。登山队员由此提出,珠峰火种灯应至少能保持稳定燃烧14个小时。这体现了中国航天\"四共同\"原则的那个原则?____","options":[{"key":"A","text":"有问题共同商量"},{"key":"B","text":"有困难共同克服"},{"key":"C","text":"有余量共同掌握"},{"key":"D","text":"有风险共同承担"}],"answer":["C"],"explanation":"**C（有余量共同掌握）**\n登山需 7–8 小时而提出火种灯稳定燃烧至少 14 小时，关键是留出并共同掌握余量，故为\"有余量共同掌握\"；勿误选\"有困难共同克服\"。","note":""},{"id":"7-8","chapter":7,"number":8,"type":"multiple","stem":"以下哪些行为符合中国航天人的道德伦理?( )","options":[{"key":"A","text":"为追求航天器的性能指标,不顾安全性问题"},{"key":"B","text":"在航天项目中弄虚作假,获取个人利益"},{"key":"C","text":"积极推广航天技术,为国家的科技发展作出贡献"},{"key":"D","text":"在困难面前坚持不懈,勇攀航天科技高峰"}],"answer":["C","D"],"explanation":"**CD**\nA（不顾安全性）、B（弄虚作假）违背航天人道德伦理；C、D 符合。","note":""},{"id":"7-9","chapter":7,"number":9,"type":"multiple","stem":"下列各项中,属于航天精神的是( )","options":[{"key":"A","text":"航天传统精神"},{"key":"B","text":"\"两弹一星\"精神"},{"key":"C","text":"载人航天精神"},{"key":"D","text":"探月精神"},{"key":"E","text":"新时代北斗精神"}],"answer":["A","B","C","D","E"],"explanation":"**ABCDE（全选）**\n航天精神谱系五项全含：航天传统精神、\"两弹一星\"精神、载人航天精神、探月精神、新时代北斗精神。","note":""},{"id":"7-10","chapter":7,"number":10,"type":"multiple","stem":"下列哪些行为体现了航天传统精神?( )","options":[{"key":"A","text":"某航天器设计师长期致力于航天器设计工作,不断追求技术突破。"},{"key":"B","text":"一支火箭发射团队在发射前进行多次演练和协调,确保发射顺利进行。"},{"key":"C","text":"一位航天员在执行任务时,始终保持对祖国的热爱和对事业的追求。"},{"key":"D","text":"一家航天企业注重自主创新,积极研发具有自主知识产权的航天技术。"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n设计师追求突破、发射团队演练协调、航天员热爱祖国、企业自主创新，均体现航天传统精神。","note":""},{"id":"7-11","chapter":7,"number":11,"type":"multiple","stem":"下列关于\"两弹一星\"精神说法正确的是:( )","options":[{"key":"A","text":"其核心是热爱祖国、无私奉献,自力更生、艰苦奋斗、大力协同、勇于登攀"},{"key":"B","text":"象征了在欠缺良好环境下,从事科学技术开发研究的精神,也是科教兴国政策的开端"},{"key":"C","text":"象征了中华民族自力更生、在社会主义之下集中力量从事科学开发研究,并创科技奇迹的态度与过程"},{"key":"D","text":"是爱国主义、集体主义、社会主义精神和科学精神的活生生体现"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n四项对\"两弹一星\"精神的表述（核心二十四字、欠缺环境下的科研精神与科教兴国开端、自力更生集中力量创奇迹、爱国主义集体主义社会主义与科学精神的体现）均正确。","note":""},{"id":"7-12","chapter":7,"number":12,"type":"multiple","stem":"下列哪些行为体现了载人航天精神的内涵?( )","options":[{"key":"A","text":"中国航天员在训练中不怕苦不怕累,坚持完成各项任务。"},{"key":"B","text":"中国航天科技工作者在研发中自主创新,推动了中国航天事业的发展。"},{"key":"C","text":"中国航天科技工作者在研发中不注重团队协作,导致任务失败。"},{"key":"D","text":"中国航天员在执行任务时表现出色,体现了中国航天科技的实力。"}],"answer":["A","B","D"],"explanation":"**ABD**\nC\"不注重团队协作,导致任务失败\"为反面描述，不选；A、B、D 体现载人航天精神内涵。","note":""},{"id":"7-13","chapter":7,"number":13,"type":"multiple","stem":"以下哪些选项体现了新时代北斗精神?( )","options":[{"key":"A","text":"追求卓越,不断挑战技术极限。"},{"key":"B","text":"勇于创新,敢于突破技术难关。"},{"key":"C","text":"团结协作,共同完成大型工程。"},{"key":"D","text":"无畏挑战,面对困难不退缩。"}],"answer":["A","B","C","D"],"explanation":"**ABCD（全选）**\n追求卓越、勇于创新、团结协作、无畏挑战均体现新时代北斗精神。","note":""},{"id":"7-14","chapter":7,"number":14,"type":"multiple","stem":"下列哪些行为体现了探月精神的内涵?( )","options":[{"key":"A","text":"探月工程团队在任务实施中密切协作,共同完成了任务。"},{"key":"B","text":"有一位科学家独自开展研究,最终取得了重要的科研成果。"},{"key":"C","text":"在一次探月任务中,各单位相互配合,共同完成了任务。"},{"key":"D","text":"探月工程人员积极分享经验,促进了国际间的交流与合作。"}],"answer":["A","C","D"],"explanation":"**ACD**\nB\"科学家独自开展研究\"不符合探月精神协同攻关的内涵；A、C、D 体现协作与共享。","note":""},{"id":"7-15","chapter":7,"number":15,"type":"multiple","stem":"以下哪些影片体现了立国之战催生\"两弹\"?( )","options":[{"key":"A","text":"横空出世"},{"key":"B","text":"长津湖"},{"key":"C","text":"志愿军"},{"key":"D","text":"我和我的祖国"}],"answer":["A","B","C"],"explanation":"**ABC**\n《横空出世》《长津湖》《志愿军》体现立国之战（抗美援朝）催生\"两弹\"；《我和我的祖国》不选。","note":""},{"id":"7-16","chapter":7,"number":16,"type":"multiple","stem":"以下哪些关于梁思礼的描述是正确的?( )","options":[{"key":"A","text":"中国导弹控制系统研制创始人之一"},{"key":"B","text":"他年轻时去美国留过学"},{"key":"C","text":"他说过这句话:\"我干的导弹是保卫我们祖国的!\""},{"key":"D","text":"梁启超之子"},{"key":"E","text":"\"东风\"导弹研制者之一"}],"answer":["A","B","C","D","E"],"explanation":"**ABCDE（全选）**\n梁思礼为梁启超之子、曾留美、中国导弹控制系统研制创始人之一、\"东风\"导弹研制者之一，名言\"我干的导弹是保卫我们祖国的!\"，五项全对。","note":""},{"id":"7-17","chapter":7,"number":17,"type":"multiple","stem":"以下哪些词语体现了中国航天人的道德伦理?( )","options":[{"key":"A","text":"爱国"},{"key":"B","text":"求实"},{"key":"C","text":"创新"},{"key":"D","text":"协同"},{"key":"E","text":"奉献"}],"answer":["A","B","C","D","E"],"explanation":"**ABCDE（全选）**\n爱国、求实、创新、协同、奉献五个词语均体现中国航天人的道德伦理。","note":""},{"id":"7-18","chapter":7,"number":18,"type":"boolean","stem":"中国航天人应该始终坚持爱国为民。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n中国航天人始终坚持爱国为民，表述正确。","note":""},{"id":"7-19","chapter":7,"number":19,"type":"boolean","stem":"载人航天精神只适用于航天领域,不适用于其他领域。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×**\n载人航天精神具有普遍价值，可推广适用于其他领域，\"只适用于航天领域\"错误。","note":""},{"id":"7-20","chapter":7,"number":20,"type":"boolean","stem":"探月精神是中国航天事业特有的精神财富,其他国家无法借鉴。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×**\n探月精神虽源于中国航天实践，但其精神价值可为他国借鉴，\"其他国家无法借鉴\"错误。","note":""},{"id":"7-21","chapter":7,"number":21,"type":"boolean","stem":"钱学森96分的水力学试卷体现了他求真务实的科学精神。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√**\n钱学森 96 分水力学试卷的故事体现其求真务实的科学精神，表述正确。","note":""},{"id":"7-22","chapter":7,"number":22,"type":"boolean","stem":"\"东方红一号\"卫星成功发射时,各分系统仪器上都被镶嵌了一枚毛主席像章。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×**\n仪器镶嵌毛主席像章的做法在发射前已被纠正去除，成功发射时各分系统仪器上并未镶嵌像章，表述错误。","note":""},{"id":"8-1","chapter":8,"number":1,"type":"single","stem":"下面压力传感器，性能最好的是（ ）","options":[{"key":"A","text":"谐振筒式压力传感器"},{"key":"B","text":"硅微结构谐振式压力传感器"},{"key":"C","text":"电位器式真空膜盒压力传感器"}],"answer":["B"],"explanation":"**B（硅微结构谐振式压力传感器）** 三类中硅微结构谐振式综合精度、稳定性、微型化优势最突出，性能最好。","note":""},{"id":"8-2","chapter":8,"number":2,"type":"single","stem":"下面压力传感器，属于模拟式传感器的是（ ）","options":[{"key":"A","text":"谐振筒式压力传感器"},{"key":"B","text":"石墨烯谐振式压力传感器"},{"key":"C","text":"硅微结构谐振式压力传感器"},{"key":"D","text":"电位器式真空膜盒压力传感器"}],"answer":["D"],"explanation":"**D（电位器式真空膜盒压力传感器）** 谐振式（含石墨烯、硅微结构）输出频率信号，属\"准数字式\"；只有电位器式输出连续模拟量。","note":""},{"id":"8-3","chapter":8,"number":3,"type":"single","stem":"林士谔先生发明的是（ ）","options":[{"key":"A","text":"真空膜盒式压力表"},{"key":"B","text":"谐振筒式压力传感器"},{"key":"C","text":"真空膜盒式压力敏感元件"},{"key":"D","text":"电位器式真空膜盒压力传感器"}],"answer":["A"],"explanation":"**A（真空膜盒式压力表）** 答案源给 A：林士谔先生早年发明真空膜盒式压力表，后与刘广玉等发展出电位器式真空膜盒压力传感器、谐振筒式传感器（见 Q12）。本题与 Q12 区分：Q3 问\"发明\"，Q12 问两人\"研制成功\"的传感器（AD）。","note":"原资料提示：本题依据参考答案源整理，请结合课件核对。"},{"id":"8-4","chapter":8,"number":4,"type":"single","stem":"下面压力传感器，解决了我国300米(1000英尺)飞行高度分层的是（ ）","options":[{"key":"A","text":"谐振筒式压力传感器"},{"key":"B","text":"石墨烯谐振式压力传感器"},{"key":"C","text":"硅微结构谐振式压力传感器"},{"key":"D","text":"电位器式真空膜盒压力传感器"}],"answer":["A"],"explanation":"**A（谐振筒式压力传感器）** 谐振筒式压力传感器精度高，用于飞机高度表，解决了我国 300 米（1000 英尺）飞行高度分层问题。","note":""},{"id":"8-5","chapter":8,"number":5,"type":"single","stem":"有关\"五环图\"，描述正确的是（ ）","options":[{"key":"A","text":"\"五环图\"能帮助我们认识事物发展规律"},{"key":"B","text":"\"五环图\"反映了五个要素的串联影响过程"},{"key":"C","text":"\"五环图\"实现了科研成果向教学资源的转化"},{"key":"D","text":"\"五环图\"能引导学生根据自身需求，个性成长分类卓越"}],"answer":["D"],"explanation":"**D（引导学生根据自身需求，个性成长分类卓越）** 答案源给 D。\"五环图\"是北航人才培养模式图，强调个性化培养、分类卓越；B 错在\"串联\"（五环为相互作用关系），A、C 表述与课件定位不符。","note":"原资料提示：本题依据参考答案源整理，请结合课件核对。"},{"id":"8-6","chapter":8,"number":6,"type":"single","stem":"谐振式传感器闭环系统中的核心环节是（ ）","options":[{"key":"A","text":"检测单元"},{"key":"B","text":"激励单元"},{"key":"C","text":"敏感元件"},{"key":"D","text":"放大单元"}],"answer":["C"],"explanation":"**C（敏感元件）** 谐振敏感元件是闭环系统的核心，系统围绕其谐振频率工作。","note":""},{"id":"8-7","chapter":8,"number":7,"type":"single","stem":"谐振式传感器闭环系统中必须工作在谐振状态的是（ ）","options":[{"key":"A","text":"放大单元"},{"key":"B","text":"检测单元"},{"key":"C","text":"激励单元"},{"key":"D","text":"敏感元件"}],"answer":["D"],"explanation":"**D（敏感元件）** 必须工作在谐振状态的正是敏感元件本身；激励、放大、检测单元为其服务。","note":""},{"id":"8-8","chapter":8,"number":8,"type":"single","stem":"发动机在地面测试时，需要压力测量的点约为（ ）","options":[{"key":"A","text":"100个"},{"key":"B","text":"300个"},{"key":"C","text":"1000个"},{"key":"D","text":"1500个"}],"answer":["C"],"explanation":"**C（1000个）** 课件数据：发动机地面测试需约 1000 个压力测量点，说明传感器用量之大。","note":""},{"id":"8-9","chapter":8,"number":9,"type":"single","stem":"看似不起眼的传感器，设计、研制、应用，应有\"大系统\"的观念。可以概括为（ ）","options":[{"key":"A","text":"勿以善远而不为"},{"key":"B","text":"勿以善小而不为"},{"key":"C","text":"独行快、众行远"},{"key":"D","text":"水滴石穿、水到渠成"}],"answer":["B"],"explanation":"**B（勿以善小而不为）** 传感器\"看似不起眼\"却关系大系统成败，对应\"勿以善小而不为\"。","note":""},{"id":"8-10","chapter":8,"number":10,"type":"multiple","stem":"下面压力传感器，可以用于计量的是（ ）","options":[{"key":"A","text":"谐振筒式压力传感器"},{"key":"B","text":"石墨烯谐振式压力传感器"},{"key":"C","text":"硅微结构谐振式压力传感器"},{"key":"D","text":"电位器式真空膜盒压力传感器"}],"answer":["A","C"],"explanation":"**AC（谐振筒式、硅微结构谐振式）** 两类谐振式压力传感器精度高、稳定性好，可用作计量标准器。石墨烯谐振式为前沿研究，尚未用于计量。","note":""},{"id":"8-11","chapter":8,"number":11,"type":"multiple","stem":"下面压力传感器，易于实现差动检测的是（ ）","options":[{"key":"A","text":"谐振筒式压力传感器"},{"key":"B","text":"石墨烯谐振式压力传感器"},{"key":"C","text":"硅微结构谐振式压力传感器"},{"key":"D","text":"电位器式真空膜盒压力传感器"}],"answer":["B","C"],"explanation":"**BC（石墨烯谐振式、硅微结构谐振式）** 微纳/微结构器件易于做成差动结构（两个对称谐振单元差动输出），谐振筒体积大不易。","note":""},{"id":"8-12","chapter":8,"number":12,"type":"multiple","stem":"我国著名传感器专家，林士谔先生与刘广玉先生研制成功的压力传感器有（ ）","options":[{"key":"A","text":"谐振筒式压力传感器"},{"key":"B","text":"石墨烯谐振式压力传感器"},{"key":"C","text":"硅微结构谐振式压力传感器"},{"key":"D","text":"电位器式真空膜盒压力传感器"}],"answer":["A","D"],"explanation":"**AD（谐振筒式、电位器式真空膜盒）** 林士谔与刘广玉两位北航传感器专家研制成功电位器式真空膜盒压力传感器和谐振筒式压力传感器；石墨烯、硅微结构为后续新体系。","note":""},{"id":"8-13","chapter":8,"number":13,"type":"multiple","stem":"属于\"准数字式\"高性能传感器的有（ ）","options":[{"key":"A","text":"谐振筒式压力传感器"},{"key":"B","text":"石墨烯谐振式压力传感器"},{"key":"C","text":"硅微结构谐振式压力传感器"},{"key":"D","text":"电位器式真空膜盒压力传感器"}],"answer":["A","B","C"],"explanation":"**ABC（三种谐振式）** \"准数字式\"指输出频率（数字可比）信号的谐振式传感器：谐振筒、石墨烯谐振、硅微结构谐振；电位器式为模拟式（与 Q2 呼应）。","note":""},{"id":"8-14","chapter":8,"number":14,"type":"multiple","stem":"下面关于传感器的说法，正确的是（ ）","options":[{"key":"A","text":"传感器需要准确地获取信息"},{"key":"B","text":"传感器需要可靠地获取信息"},{"key":"C","text":"传感器不能获取信息"},{"key":"D","text":"传感器是信息技术的源头"}],"answer":["A","B","D"],"explanation":"**ABD** 传感器要准确（A）、可靠（B）地获取信息，是信息技术的源头（D）；C 明显错误。","note":""},{"id":"8-15","chapter":8,"number":15,"type":"multiple","stem":"下面体现\"作为信息的提供方，要充分考虑准确表述信息的重要意义\"的是（ ）（图片选项）","options":[{"key":"A","text":"飞机座椅安全带照片"},{"key":"B","text":"公路广告照片：工人掀起路面\"地毯\"露出坑洼，路面文字 \"FEELS LIKE PIONEER SUSPENSION\""},{"key":"C","text":"诺基亚按键手机照片"},{"key":"D","text":"混合动力汽车动力系统结构示意图（透明车身、电池组、能量流向箭头）"}],"answer":["A","B"],"explanation":"**AB（图片题）** A 飞机座椅安全带：安全带/指示灯以准确方式向乘客传递安全信息；B 公路广告\"FEELS LIKE PIONEER SUSPENSION\"：把路面做成\"地毯\"掩盖坑洼，是（反讽式）信息表述案例——两者都体现\"信息提供方要充分考虑准确表述信息的重要意义\"。C 手机、D 混动汽车结构与\"信息表述\"主题无直接关联。","note":"原题为图片选项；当前资料仅有图片的文字描述，下方按原描述呈现。"},{"id":"8-16","chapter":8,"number":16,"type":"multiple","stem":"颠覆性技术的出现，启发人们在专业课学习中（ ）","options":[{"key":"A","text":"\"传授知识\"很重要"},{"key":"B","text":"\"传授方法\"很重要"},{"key":"C","text":"\"培养能力\"很重要"},{"key":"D","text":"\"塑造价值\"很重要"}],"answer":["B","C","D"],"explanation":"**BCD** 颠覆性技术使知识更新加速，专业课学习重心从\"传授知识\"转向传授方法（B）、培养能力（C）、塑造价值（D）。","note":""},{"id":"8-17","chapter":8,"number":17,"type":"multiple","stem":"下列属于\"五环图\"要素的是（ ）","options":[{"key":"A","text":"科学问题"},{"key":"B","text":"关键技术"},{"key":"C","text":"工程应用"},{"key":"D","text":"技术进步"}],"answer":["A","B","C"],"explanation":"**ABC（科学问题、关键技术、工程应用）** \"五环图\"要素链条：科学问题→关键技术→工程应用（→学科/人才等）；\"技术进步\"不在其列。","note":""},{"id":"8-18","chapter":8,"number":18,"type":"multiple","stem":"谐振式传感器闭环系统中的放大单元具有的功能是（ ）","options":[{"key":"A","text":"激励作用"},{"key":"B","text":"调节幅值"},{"key":"C","text":"调节相位"},{"key":"D","text":"检测作用"}],"answer":["B","C"],"explanation":"**BC（调节幅值、调节相位）** 放大单元在闭环中起放大并调节信号幅值与相位的作用，使系统满足振荡平衡条件；激励是激励单元功能，检测是检测单元功能。","note":""},{"id":"8-19","chapter":8,"number":19,"type":"multiple","stem":"有关对传感器描述正确的是（ ）","options":[{"key":"A","text":"传感器的体积小、轻重量"},{"key":"B","text":"传感器越大，应用价值越高"},{"key":"C","text":"传感器虽小，对系统的影响很大"},{"key":"D","text":"传感器可大可小，应根据应用情况来定"}],"answer":["C","D"],"explanation":"**CD** 传感器并非都小（A 错），也不是越大价值越高（B 错）；C\"虽小影响大\"、D\"可大可小、依应用而定\"正确。","note":""},{"id":"8-20","chapter":8,"number":20,"type":"boolean","stem":"被测气体介质接触敏感元件的压力传感器比不接触敏感元件的压力传感器性能更好。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** 被测介质直接接触敏感元件会腐蚀、磨损敏感元件，可靠性与寿命更差；不接触（隔离）结构性能更好。本题说反了。","note":""},{"id":"8-21","chapter":8,"number":21,"type":"boolean","stem":"以真空膜盒为压力敏感元件的传感器可以实现指针式输出方式，从而实现仪表的高可靠性。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 真空膜盒驱动指针式输出（机械式高度表/压力表），无需供电与复杂电路，实现仪表高可靠性。","note":""},{"id":"8-22","chapter":8,"number":22,"type":"boolean","stem":"硅微结构谐振式压力传感器实现高性能的主要原因是采用了二次复合敏感结构。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 硅微结构谐振式压力传感器采用\"膜片+梁\"二次复合敏感结构（压力→膜片应力→梁频率），是实现高性能的主要原因。","note":""},{"id":"8-23","chapter":8,"number":23,"type":"boolean","stem":"作为信息技术的源头，传感器就是要准确、实时、可靠地获得所需要的信息。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 传感器作为信息技术源头，核心要求即准确、实时、可靠地获取信息（与 Q14 呼应）。","note":""},{"id":"8-24","chapter":8,"number":24,"type":"boolean","stem":"作为信息的产出方或提供方，要充分考虑准确表述信息的重要意义。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 与 Q15 主题一致：信息的产出方/提供方要充分考虑准确表述信息的重要意义。","note":""},{"id":"9-1","chapter":9,"number":1,"type":"multiple","stem":"在移动互联网、大数据、超级计算、传感网、脑科学等新理论新技术以及经济社会发展强烈需求的共同驱动下,人工智能加速发展,呈现出哪些新特征?()","options":[{"key":"A","text":"跨界融合"},{"key":"B","text":"人机协同"},{"key":"C","text":"群智开放"},{"key":"D","text":"自主操控"}],"answer":["A","B","C","D"],"explanation":"**ABCD（跨界融合、人机协同、群智开放、自主操控）**\n《新一代人工智能发展规划》原文：人工智能\"呈现出深度学习、跨界融合、人机协同、群智开放、自主操控等新特征\"，四项全部出自原文。","note":""},{"id":"9-2","chapter":9,"number":2,"type":"multiple","stem":"以下哪些是属于中国的人工智能大模型?()","options":[{"key":"A","text":"星火"},{"key":"B","text":"文心一言"},{"key":"C","text":"混元"},{"key":"D","text":"华为盘古"}],"answer":["A","B","C","D"],"explanation":"**ABCD（星火／文心一言／混元／华为盘古）**\n讯飞星火、百度文心一言、腾讯混元、华为盘古，均为国产大模型。干扰项通常是 GPT／Gemini／Claude 等国外模型。","note":""},{"id":"9-3","chapter":9,"number":3,"type":"multiple","stem":"关于构建泛在安全高效的智能化基础设施体系,下面说法正确的是( )","options":[{"key":"A","text":"大力推动智能化信息基础设施建设,提升传统基础设施的智能化水平,形成适应智能经济、智能社会和国防建设需要的基础设施体系。"},{"key":"B","text":"加快推动以信息传输为核心的数字化、网络化信息基础设施,向集融合感知、传输、存储、计算、处理于一体的智能化信息基础设施转变。"},{"key":"C","text":"优化升级网络基础设施,研发布局第五代移动通信(5G)系统,完善物联网基础设施,加快天地一体化信息网络建设,提高低时延、高通量的传输能力。"},{"key":"D","text":"统筹利用大数据基础设施,强化数据安全与隐私保护,为人工智能研发和广泛应用提供海量数据支撑。"}],"answer":["A","B","C","D"],"explanation":"**ABCD**\n四句都是《规划》\"构建泛在安全高效的智能化基础设施体系\"的原文表述：智能化信息基础设施、由信息传输为核心转向融合感知-传输-存储-计算-处理、5G 与天地一体化网络、大数据基础设施与数据安全。","note":""},{"id":"9-4","chapter":9,"number":4,"type":"multiple","stem":"关于图灵测试,以下哪些说法是正确的?( )","options":[{"key":"A","text":"图灵测试是由艾伦·图灵在1950年提出的"},{"key":"B","text":"图灵测试可以用于评估所有类型的人工智能"},{"key":"C","text":"旨在评估人工智能系统的智能程度,以确定它是否能够表现得像一个人类一样思考或表现出智能。"},{"key":"D","text":"图灵测试要求机器必须具备人类情感"}],"answer":["A","C"],"explanation":"**AC（1950 年提出／评估智能程度）**\nB 错在\"所有类型\"，图灵测试只针对对话式智能表现；D 错在\"必须具备人类情感\"，图灵测试是行为判据，不要求情感。","note":""},{"id":"9-5","chapter":9,"number":5,"type":"multiple","stem":"以下哪些是AlphaGo Zero的特点( )","options":[{"key":"A","text":"通过自我对弈学习"},{"key":"B","text":"利用蒙特卡罗树搜索"},{"key":"C","text":"不需要蒙特卡罗树搜索"},{"key":"D","text":"使用了残差神经网络"}],"answer":["A","B","D"],"explanation":"**ABD（自我对弈／蒙特卡罗树搜索／残差网络）**\nAlphaGo Zero 只用一个残差神经网络 + PUCT（蒙特卡罗树搜索变体）从自我对弈中学习；B 与 C 互斥，Zero 仍然做树搜索，所以 C 错。","note":""},{"id":"9-6","chapter":9,"number":6,"type":"multiple","stem":"GPTZero的哪些特点使其在学校中迅速传播开来?( )","options":[{"key":"A","text":"高准确率"},{"key":"B","text":"快速检测"},{"key":"C","text":"易于使用。"},{"key":"D","text":"开源性质"}],"answer":["A","B","C","D"],"explanation":"**ABCD（高准确率／快速检测／易于使用／开源性质）**\n课件对 GPTZero 传播原因的四点概括，全不选反而更容易失分。","note":""},{"id":"9-7","chapter":9,"number":7,"type":"multiple","stem":"以下哪些属于《新一代人工智能伦理规范》中提到的基本伦理要求( )","options":[{"key":"A","text":"增进人类福祉"},{"key":"B","text":"保护知识产权"},{"key":"C","text":"保护隐私安全"},{"key":"D","text":"强化责任担当"}],"answer":["A","B","C","D"],"explanation":"**ABCD（参考答案）／严格口径 ACD**\n增进人类福祉、保护隐私安全、强化责任担当都是\"基本伦理要求\"六项之内；\"保护知识产权\"在《规范》中属于具体规范要求。见开头提示。","note":"原资料提示：参考答案为 ABCD；按规范原文的“基本伦理要求”范围应为 ACD，详见解析。"},{"id":"9-8","chapter":9,"number":8,"type":"multiple","stem":"以下哪些法律是《生成式人工智能服务管理暂行办法》制定依据()","options":[{"key":"A","text":"《中华人民共和国网络安全法》"},{"key":"B","text":"《中华人民共和国数据安全法》"},{"key":"C","text":"《中华人民共和国个人信息保护法》"},{"key":"D","text":"《中华人民共和国科学技术进步法》"}],"answer":["A","B","C","D"],"explanation":"**ABCD（网络安全法／数据安全法／个人信息保护法／科学技术进步法）**\n《生成式人工智能服务管理暂行办法》第一条列明的上位法依据正是这四部。","note":""},{"id":"9-9","chapter":9,"number":9,"type":"multiple","stem":"《新一代人工智能伦理规范》中,管理活动主要指( )","options":[{"key":"A","text":"人工智能相关的战略规划"},{"key":"B","text":"政策法规和技术标准制定实施"},{"key":"C","text":"资源配置以及监督审查"},{"key":"D","text":"人工智能产品与服务相关的生产、运营、销售等"}],"answer":["A","B","C"],"explanation":"**ABC（战略规划／政策法规与技术标准／资源配置与监督审查）**\nD\"生产、运营、销售\"属于供应侧的市场活动，不是《规范》定义的\"管理活动\"。","note":""},{"id":"9-10","chapter":9,"number":10,"type":"multiple","stem":"下面说法正确的是( )","options":[{"key":"A","text":"要推动人工智能赋能,坚持人工智能向善"},{"key":"B","text":"《生成式人工智能服务管理暂行办法》自2024年1月1日起施行。"},{"key":"C","text":"要促进人工智能与社会进步相辅相成"},{"key":"D","text":"要遵守相关法律法规,尊重相关伦理道德"}],"answer":["A","C","D"],"explanation":"**ACD**\nB 错在时间：《生成式人工智能服务管理暂行办法》自 **2023 年 8 月 15 日** 起施行，不是 2024 年 1 月 1 日。这是本讲最容易被\"看着眼熟就选\"的坑。","note":""},{"id":"9-11","chapter":9,"number":11,"type":"boolean","stem":"国务院印发《新一代人工智能发展规划》,这是中国关于新一代人工智能的布局。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 2017 年 7 月国务院印发《新一代人工智能发展规划》，是中国新一代人工智能的顶层布局。","note":""},{"id":"9-12","chapter":9,"number":12,"type":"boolean","stem":"欧盟率先于中国发布人工智能发展规划。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** 中国（2017）早于欧盟（2018）发布人工智能发展规划，题干说反了。","note":""},{"id":"9-13","chapter":9,"number":13,"type":"boolean","stem":"根据《新一代人工智能发展规划》,要积极开展人工智能研发和治理,在全国范围内优化配置资源。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** 《规划》的表述是在重点领域／相关范围内优化配置资源，不是\"全国范围内\"铺开；题干把范围说大了。","note":""},{"id":"9-14","chapter":9,"number":14,"type":"boolean","stem":"信息基础设施建设是新型基础设施建设三大方向之一。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 新基建三大方向：信息基础设施、融合基础设施、创新基础设施。","note":""},{"id":"9-15","chapter":9,"number":15,"type":"boolean","stem":"布局新一代人工智能重大科技项目属于人工智能发展的六大任务之一。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 六大任务之首即\"布局新一代人工智能重大科技项目\"。","note":""},{"id":"9-16","chapter":9,"number":16,"type":"boolean","stem":"人工智能在中国的接受度较高。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 课件引用调查数据说明国内公众对人工智能接受度较高。","note":""},{"id":"9-17","chapter":9,"number":17,"type":"boolean","stem":"人工智能没有超越人类领域专家的可能。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** AlphaGo、大模型等已在多个领域超越人类专家，\"没有可能\"是否定式陷阱。","note":""},{"id":"9-18","chapter":9,"number":18,"type":"boolean","stem":"全球拥有人工智能专利数目的企业排行榜中,中国企业表现优秀。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 全球 AI 专利持有企业排行榜中，中国企业（腾讯、百度、华为、京东方等）数量与位次表现突出。","note":""},{"id":"9-19","chapter":9,"number":19,"type":"boolean","stem":"加强科技开放合作是中国政府一贯坚持的原则。中国既是国际前沿创新的重要参与者,也是共同解决全人类问题的重要贡献者。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 加强科技开放合作是一贯原则，中国既是重要参与者也是重要贡献者。","note":""},{"id":"10-1","chapter":10,"number":1,"type":"single","stem":"航空活动的范围是___","options":[{"key":"A","text":"0--15km"},{"key":"B","text":"0--10km"},{"key":"C","text":"30km以下"},{"key":"D","text":"50km以下"}],"answer":["C"],"explanation":"**C（航空活动的范围：30km 以下）** 大气层 30km 以内属于航空活动范围，超出即进入航天领域。","note":""},{"id":"10-2","chapter":10,"number":2,"type":"single","stem":"莱特兄弟制造的\"飞行者一号\"是世界上第一架有动力的飞机，\"飞行者一号\"诞生的时间是___","options":[{"key":"A","text":"1898年"},{"key":"B","text":"1903年"},{"key":"C","text":"1911年"},{"key":"D","text":"1905年"}],"answer":["B"],"explanation":"**B（1903 年）** 莱特兄弟\"飞行者一号\"1903 年 12 月 17 日首飞。","note":""},{"id":"10-3","chapter":10,"number":3,"type":"single","stem":"空难对航空工程的发展有推动作用，历史上有一起空难直接引发了人们对航空器疲劳问题的研究，并催生了结构完整性这一概念的产生，这起空难是___","options":[{"key":"A","text":"1954年\"哈维兰彗星\"客机空难"},{"key":"B","text":"1958年B-47轰炸机事故"},{"key":"C","text":"1977年波音707客机空难"},{"key":"D","text":"1969年F-111战斗机事故"}],"answer":["C"],"explanation":"**C（1977 年波音707客机空难）** 按课件口径确认选 C：课件将\"直接引发航空器疲劳问题研究、催生结构完整性概念\"的空难讲为 1977 年波音707客机空难。（通识航空史常把疲劳/结构完整性研究与 1954 年\"彗星\"空难联系在一起，但本课以 C 为准。）","note":"沿用整合资料中已确认的课件口径：C（1977 年波音 707 客机空难）。"},{"id":"10-4","chapter":10,"number":4,"type":"single","stem":"2019年3月10日埃塞俄比亚航空公司空难的最主要原因是___","options":[{"key":"A","text":"发动机在飞行过程中出现故障"},{"key":"B","text":"迎角传感器失灵，机动特性增强系统出现故障"},{"key":"C","text":"飞行员经验不足"},{"key":"D","text":"地面塔台指挥失误"}],"answer":["B"],"explanation":"**B（迎角传感器失灵 + MCAS 故障）** 埃航 ET302 事故调查认定主因是迎角传感器数据错误触发机动特性增强系统（MCAS）反复低头配平。","note":""},{"id":"10-5","chapter":10,"number":5,"type":"single","stem":"关于现代战争和武器，下列说法正确的是___","options":[{"key":"A","text":"现有无人机技术尚未成熟，不能自主击杀有生目标"},{"key":"B","text":"随着科学技术的发展，战争导致的伤亡人数逐渐增加"},{"key":"C","text":"高科技武器大幅增加了战争的伤亡人数，因此应被抵制"},{"key":"D","text":"将科学技术用在正确的地方需要依靠伦理制约"}],"answer":["D"],"explanation":"**D（科技用于正确方向需要伦理制约）** A 与现状不符（无人机已具备自主打击能力讨论空间）、B/C 把伤亡归因于科技发展，均非课程立场。","note":""},{"id":"10-6","chapter":10,"number":6,"type":"single","stem":"关于印尼狮航空难所涉及的波音737MAX客机，下列说法不正确的是___","options":[{"key":"A","text":"该机针对市场航线进行了贴切的改装"},{"key":"B","text":"该机在老机型的基础上加装了更大的发动机"},{"key":"C","text":"该机引用了MCAS以调整飞机的仰角"},{"key":"D","text":"该机设计的重要理念之一是低成本"}],"answer":["A"],"explanation":"**A（说法不正确）** 737MAX 是在老机型上\"缝补式\"改装：换大发动机→装 MCAS 压仰角→主打低成本，并非\"针对市场航线的贴切改装\"。","note":""},{"id":"10-7","chapter":10,"number":7,"type":"single","stem":"印尼狮航空难的发生原因不包括___","options":[{"key":"A","text":"印尼狮航空中管控系统的问题"},{"key":"B","text":"波音对所提供客机的不负责"},{"key":"C","text":"印尼狮航管理机制的缺失"},{"key":"D","text":"机组人员经验和应变能力的缺乏"}],"answer":["A"],"explanation":"**A（原因不包括空中管控系统问题）** 狮航 JT610 成因链在波音设计/责任、狮航管理机制、机组经验应变，不涉及空管系统。","note":""},{"id":"10-8","chapter":10,"number":8,"type":"single","stem":"关于我国航空发展史，下列说法正确的是___","options":[{"key":"A","text":"\"初教5\"是我国第一架自主研发的飞机"},{"key":"B","text":"\"运-5\"是我国第一架军用运输机"},{"key":"C","text":"\"歼教-1\"是我国首架完全自主设计制造的飞机"},{"key":"D","text":"2022年5月，C919顺利完成首个商业航班飞行，正式进入民航市场"}],"answer":["C"],"explanation":"**C⚠（\"歼教-1\"是我国首架完全自主设计制造的飞机）** 课程口径如此。注意 D 的干扰性：C919 首个商业航班实际是 **2023 年 5 月**（2022 年 5 月是完成适航取证前的交付试飞/首飞后节点表述），年份不对故排除。A 错（初教-5 为仿制装配）、B 错（运-5 为仿制安-2）。","note":"原资料对此题作了存疑标记，请结合课件核对。"},{"id":"10-9","chapter":10,"number":9,"type":"multiple","stem":"第一次世界大战期间出现的飞机包括()","options":[{"key":"A","text":"德国福克D.VII"},{"key":"B","text":"英国索普维斯\"骆驼\""},{"key":"C","text":"美国P51\"野马\""},{"key":"D","text":"法国斯帕德S.XIII"}],"answer":["A","B","D"],"explanation":"**ABD** 福克 D.VII（德）、索普维斯\"骆驼\"（英）、斯帕德 S.XIII（法）均为一战名机；P-51\"野马\"是二战机型。","note":""},{"id":"10-10","chapter":10,"number":10,"type":"multiple","stem":"第二次世界大战期间出现的飞机主要特点包括()","options":[{"key":"A","text":"速度达到800km/h"},{"key":"B","text":"普遍舍弃了双翼的设计方案"},{"key":"C","text":"使用木质或复合材料蒙皮"},{"key":"D","text":"升限可以超过4000m"}],"answer":["B","D"],"explanation":"**BD** 二战飞机：单翼布局普及（B）、升限超过 4000m（D）。A 错（活塞式极速约 700km/h 级别，未普遍达到 800）、C 错（二战主流为全金属蒙皮，木质/复合材料是更早或特殊机型特征）。","note":""},{"id":"10-11","chapter":10,"number":11,"type":"multiple","stem":"我国完全自主设计制造的飞机包括()","options":[{"key":"A","text":"初教-5"},{"key":"B","text":"歼教-1"},{"key":"C","text":"运-5"},{"key":"D","text":"运-10"}],"answer":["B","D"],"explanation":"**BD** 歼教-1、运-10 为我国自主设计制造；初教-5、运-5 属仿制/装配。","note":""},{"id":"10-12","chapter":10,"number":12,"type":"multiple","stem":"2018年10月29日，印尼狮航的一架波音737MAX8客机（航班号JT610），从雅加达国际机场起飞13分钟后失联，在附近海域坠毁。这起空难的原因包括()","options":[{"key":"A","text":"飞机发动机在飞行过程中出现故障"},{"key":"B","text":"飞机的迎角传感器出现故障"},{"key":"C","text":"飞机维护不力"},{"key":"D","text":"飞行员培训不足"}],"answer":["B","C","D"],"explanation":"**BCD** 迎角传感器故障、飞机维护不力、飞行员培训不足均为狮航空难成因；发动机空中故障不是（那是埃航之外的另一表述干扰，实际两起 737MAX 事故主因均为 MCAS+迎角传感器）。","note":""},{"id":"10-13","chapter":10,"number":13,"type":"multiple","stem":"早期人类对于飞行的探索包括()","options":[{"key":"A","text":"战国时代的风筝"},{"key":"B","text":"三国时代的孔明灯"},{"key":"C","text":"晋代的竹蜻蜓"},{"key":"D","text":"宋代的火箭"}],"answer":["A","B","C","D"],"explanation":"**ABCD** 风筝（战国）、孔明灯（三国）、竹蜻蜓（晋）、火箭（宋）均为早期飞行探索。","note":""},{"id":"10-14","chapter":10,"number":14,"type":"multiple","stem":"关于工程和工程伦理，下列说法正确的是()","options":[{"key":"A","text":"工程特指的是与航空相关的工作领域"},{"key":"B","text":"工程是一项重要且需经学习而得的专业领域"},{"key":"C","text":"工程师们背负着社会的期待，应展现最高标准的诚实与正直"},{"key":"D","text":"工程师的专业领域各有不同，因此不必受到工程伦理的约束"}],"answer":["B","C"],"explanation":"**BC** A 把工程局限为航空，错；D 否认工程伦理约束，错。","note":""},{"id":"10-15","chapter":10,"number":15,"type":"multiple","stem":"关于C919客机，下列说法正确的是()","options":[{"key":"A","text":"2009年，中国商飞发布了首个单通道常规布局150座级大型客机机型代号\"COMAC919\""},{"key":"B","text":"2017年5月，C919在上海浦东机场圆满首飞。"},{"key":"C","text":"C919的成功标志着中国航空工程取得了巨大的成就"},{"key":"D","text":"C919的成功为实现\"中国制造2025\"战略目标提供了有力支撑"}],"answer":["A","B","C","D"],"explanation":"**ABCD** 2009 年发布 COMAC919 代号、2017 年 5 月浦东首飞、成就与\"中国制造 2025\"支撑，均正确。","note":""},{"id":"10-16","chapter":10,"number":16,"type":"boolean","stem":"航空工程所包含的学科包括流体力学、飞行力学、航空发动机、材料与制造工艺、通信与导航技术。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 流体力学、飞行力学、航空发动机、材料与制造工艺、通信与导航技术均为航空工程支撑学科。","note":""},{"id":"10-17","chapter":10,"number":17,"type":"boolean","stem":"1974年，美国军用标准中首次提出\"结构完整性\"这一名词，用于规范飞机的安全性。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** \"结构完整性\"术语进入美国军用标准的时间与题目表述（1974 年）不符，按课件口径为错误表述。","note":""},{"id":"10-18","chapter":10,"number":18,"type":"boolean","stem":"最早投入商业使用的喷气式客机是美国的波音707客机。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** 最早投入商业使用的喷气式客机是 1952 年英国的\"哈维兰彗星\"，不是波音 707。","note":""},{"id":"10-19","chapter":10,"number":19,"type":"boolean","stem":"2018年10月29日印尼狮航空难的出现原因是多方面的，包括飞机系统的故障、飞机维护不力、相关人员经验缺失等。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 狮航空难原因多方面：系统故障、维护不力、人员经验缺失。","note":""},{"id":"10-20","chapter":10,"number":20,"type":"boolean","stem":"航空工程师应尽对安全义务，即在航空领域的工作过程中，应该运用自身的职业技能减少工程项目的不确定性，减少航空工程中可能产生或存在的风险。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 航空工程师的安全义务：以职业技能减少工程不确定性与风险。","note":""},{"id":"11-1","chapter":11,"number":1,"type":"single","stem":"安全监测能够识别系统威胁，但是不能保障敏感信息封闭，这是技术的( )","options":[{"key":"A","text":"双重性"},{"key":"B","text":"局限性"},{"key":"C","text":"安全性"},{"key":"D","text":"单一性"}],"answer":["B"],"explanation":"**B（局限性）** 技术能识别威胁却做不到让敏感信息绝对封闭，说的是技术能力的边界，即局限性；不是\"双重性\"（那指技术既可造福也可危害）。","note":""},{"id":"11-2","chapter":11,"number":2,"type":"single","stem":"网络工程师在技术研发中要重点考虑权衡技术___和伦理___之间的分寸。( )","options":[{"key":"A","text":"合法性、合理性"},{"key":"B","text":"创新性、合法性"},{"key":"C","text":"可靠性、可行性"},{"key":"D","text":"双重性、局限性"}],"answer":["C"],"explanation":"**C（可靠性、可行性）⚠** 课程口径：技术研发中要权衡\"技术上的可靠性/可行性\"与\"伦理上的可接受性\"之间的分寸。A\"合法性、合理性\"读起来也顺，但非本课表述，注意区分。","note":"原资料提示：本题采用课程表述，详见解析。"},{"id":"11-3","chapter":11,"number":3,"type":"single","stem":"网络空间与现实空间的根本区别是( )","options":[{"key":"A","text":"匿名性"},{"key":"B","text":"去中心化"},{"key":"C","text":"虚拟性"},{"key":"D","text":"交互性"}],"answer":["C"],"explanation":"**C（虚拟性）** 网络空间与现实空间的根本区别在于虚拟性；匿名性、去中心化、交互性都是虚拟性派生出的特征。","note":""},{"id":"11-4","chapter":11,"number":4,"type":"single","stem":"目前，网络空间的发展很大程度要依赖于( )","options":[{"key":"A","text":"个人道德"},{"key":"B","text":"群体监督"},{"key":"C","text":"法律法规"},{"key":"D","text":"企业责任"}],"answer":["A"],"explanation":"**A（个人道德）** 本课观点：网络空间发展目前很大程度依赖个人道德自律，法律与他律机制仍在完善中。","note":""},{"id":"11-5","chapter":11,"number":5,"type":"single","stem":"___是讨论伦理问题的前提条件。( )","options":[{"key":"A","text":"身份"},{"key":"B","text":"法律"},{"key":"C","text":"情境"},{"key":"D","text":"冲突"}],"answer":["C"],"explanation":"**C（情境）** 情境是讨论伦理问题的前提条件——同一行为在不同情境下伦理评价不同。","note":""},{"id":"11-6","chapter":11,"number":6,"type":"single","stem":"道德心理学中讲，任何理由都是行为者的心理判断，包含___和___。( )","options":[{"key":"A","text":"道德直觉，社会要求"},{"key":"B","text":"内在意图，外在动机"},{"key":"C","text":"内在动机，外在引导"},{"key":"D","text":"内在理由，外部压力"}],"answer":["C"],"explanation":"**C（内在动机，外在引导）** 道德心理学表述：任何理由都是行为者的心理判断，包含内在动机与外在引导。","note":""},{"id":"11-7","chapter":11,"number":7,"type":"single","stem":"《网络安全法》规定网络运营者必须遵循___的原则来收集个人信息。( )","options":[{"key":"A","text":"合理、合法、合规"},{"key":"B","text":"合法、透明、必要"},{"key":"C","text":"透明、合法、正当"},{"key":"D","text":"合法、正当、必要"}],"answer":["D"],"explanation":"**D（合法、正当、必要）** 《网络安全法》第 41 条原文即\"合法、正当、必要\"原则。","note":""},{"id":"11-8","chapter":11,"number":8,"type":"multiple","stem":"以下哪些属于网络空间安全的内涵( )","options":[{"key":"A","text":"设备安全"},{"key":"B","text":"系统安全"},{"key":"C","text":"数据安全"},{"key":"D","text":"行为安全"}],"answer":["A","C","D"],"explanation":"**ACD（设备安全、数据安全、行为安全）** 网络空间安全内涵三要素：设备安全、数据安全、行为安全；\"系统安全\"不在本课三分法内，是干扰项。","note":""},{"id":"11-9","chapter":11,"number":9,"type":"multiple","stem":"下列各项中，属于网络安全技术的是( )","options":[{"key":"A","text":"防火墙"},{"key":"B","text":"VPN"},{"key":"C","text":"密钥管理"},{"key":"D","text":"身份认证"}],"answer":["A","B","C","D"],"explanation":"**ABCD** 防火墙、VPN、密钥管理、身份认证均为网络安全技术。","note":""},{"id":"11-10","chapter":11,"number":10,"type":"multiple","stem":"以下哪些属于网络安全的保护对象( )","options":[{"key":"A","text":"环境"},{"key":"B","text":"组织"},{"key":"C","text":"用户资产"},{"key":"D","text":"价值观"}],"answer":["A","B","C"],"explanation":"**ABC（环境、组织、用户资产）** 网络安全的保护对象；\"价值观\"属于观念层面，不是保护对象。","note":""},{"id":"11-11","chapter":11,"number":11,"type":"multiple","stem":"以下哪些属于基本伦理原则( )","options":[{"key":"A","text":"自由"},{"key":"B","text":"平等"},{"key":"C","text":"公正"},{"key":"D","text":"责任"}],"answer":["A","B","C","D"],"explanation":"**ABCD（自由、平等、公正、责任）** 四项均为基本伦理原则。","note":""},{"id":"11-12","chapter":11,"number":12,"type":"multiple","stem":"在网络自由与网络保护之间，哪些措施应当加强( )","options":[{"key":"A","text":"个人道德约束"},{"key":"B","text":"企业平台管控"},{"key":"C","text":"心理知识的社会普及"},{"key":"D","text":"上网权限缩减"}],"answer":["A","B","C"],"explanation":"**ABC** 加强个人道德约束、企业平台管控、心理知识的社会普及；D\"上网权限缩减\"以牺牲自由换保护，不是课程主张。","note":""},{"id":"11-13","chapter":11,"number":13,"type":"multiple","stem":"网络空间的信息可以通过技术进行追溯，有什么负面影响( )","options":[{"key":"A","text":"个人隐私泄露"},{"key":"B","text":"遮蔽主体遗忘"},{"key":"C","text":"违背信息自由处置权利"},{"key":"D","text":"加剧社会不公正"}],"answer":["B","C"],"explanation":"**BC⚠** 信息可追溯的负面影响：遮蔽主体遗忘（被遗忘权落空）、违背信息自由处置权利。A\"个人隐私泄露\"看似最直观，但课程把泄露归因于保护不力而非\"追溯\"本身，D 与追溯无直接关系。这题与直觉差异最大，务必以课件为准。","note":"原资料提示：本题答案与直觉存在差异，请结合课件核对。"},{"id":"11-14","chapter":11,"number":14,"type":"multiple","stem":"以下哪些属于《著作权法》界定的\"在下列情况下使用作品，可以不经著作权人许可\"的合理情况?( )","options":[{"key":"A","text":"为个人学习、研究或者欣赏，使用他人已经发表的作品"},{"key":"B","text":"为介绍、评论某一作品或者说明某一问题，在作品中适当引用他人已经发表的作品"},{"key":"C","text":"对设置或者陈列在公共场所的艺术作品进行临摹、绘画、摄影、录像"},{"key":"D","text":"表演已经发表的作品"}],"answer":["A","B","C"],"explanation":"**ABC** 《著作权法》合理使用情形：个人学习研究欣赏、适当引用、临摹拍摄公共场所艺术作品。D\"表演已经发表的作品\"属于法定许可/使用他人作品演出应取得许可的情形，不在该列举内。","note":""},{"id":"11-15","chapter":11,"number":15,"type":"multiple","stem":"如何解决伦理困境，以下哪些可以考虑?( )","options":[{"key":"A","text":"发展可信、可控的技术"},{"key":"B","text":"将伦理价值嵌入研究"},{"key":"C","text":"网络平台严格筛查不安全的用户行为和内容"},{"key":"D","text":"推动网络安全法律法规的完善"}],"answer":["A","B","C","D"],"explanation":"**ABCD** 可信可控技术、伦理价值嵌入研究、平台筛查、法规完善，四条都是解决伦理困境的路径。","note":""},{"id":"11-16","chapter":11,"number":16,"type":"boolean","stem":"网络安全问题的引发，是因为网络空间的行为涉及违法。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** 网络安全问题很多源于技术缺陷、管理疏漏、过失行为，并非都由违法行为引发，因果表述过窄。","note":""},{"id":"11-17","chapter":11,"number":17,"type":"boolean","stem":"网络安全是一种抵御网络威胁的工具。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 网络安全本质上就是抵御网络威胁的工具（手段），而非目的本身。","note":""},{"id":"11-18","chapter":11,"number":18,"type":"boolean","stem":"网络工程师在使用技术中会面临职业道德与社会责任的取舍。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 网络工程师使用技术时确实会面临职业道德与社会责任的取舍。","note":""},{"id":"11-19","chapter":11,"number":19,"type":"boolean","stem":"现实空间的法律法规在网络空间也是通用的。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** 现实空间法律不能简单照搬到网络空间，网络空间的虚拟性、跨域性决定了需要专门立法（如《网络安全法》）。","note":""},{"id":"12-1","chapter":12,"number":1,"type":"single","stem":"智能制造导致人类道德风险有______?( )","options":[{"key":"A","text":"自动监管"},{"key":"B","text":"创造力"},{"key":"C","text":"歧视问题"},{"key":"D","text":"职业素养"}],"answer":["C"],"explanation":"**C（歧视问题）** 算法与智能设备可能复制甚至放大就业、服务上的歧视，属于道德风险；自动监管、创造力、职业素养不是\"风险\"本身。","note":""},{"id":"12-2","chapter":12,"number":2,"type":"single","stem":"现代工业体系下广泛使用机器人自动化生产线，说明()","options":[{"key":"A","text":"人与人的关系发生了变化"},{"key":"B","text":"人与机器的关系发生了变化"},{"key":"C","text":"人与社会的关系发生了变化"},{"key":"D","text":"人与环境的关系发生了变化"}],"answer":["B"],"explanation":"**B（人与机器的关系发生了变化）** 机器人自动化生产线直接改变的是生产线上人与机器的关系。","note":""},{"id":"12-3","chapter":12,"number":3,"type":"single","stem":"当收到个性化定制订单，智能制造采用的方法是()","options":[{"key":"A","text":"先设计后加工再调试"},{"key":"B","text":"找合适的加工团队"},{"key":"C","text":"快速设计、适应性生产和优化调度资源"},{"key":"D","text":"数据分析和管理"}],"answer":["C"],"explanation":"**C（快速设计、适应性生产和优化调度资源）** 个性化定制要求柔性制造：快速设计 + 适应性生产 + 资源优化调度；A 是传统制造流程。","note":""},{"id":"12-4","chapter":12,"number":4,"type":"multiple","stem":"智能制造采用()手段，由智能机器人和人类专家共同完成的产品制造过程。","options":[{"key":"A","text":"自动化"},{"key":"B","text":"数字化"},{"key":"C","text":"网络化"},{"key":"D","text":"智能化"}],"answer":["A","B","C","D"],"explanation":"**ABCD** 智能制造定义四要素：自动化、数字化、网络化、智能化，由智能机器人与人类专家共同完成。","note":""},{"id":"12-5","chapter":12,"number":5,"type":"multiple","stem":"下列各项中，属于智能制造领域工程师的伦理责任有()","options":[{"key":"A","text":"数据安全"},{"key":"B","text":"风险报酬"},{"key":"C","text":"人机协同安全"},{"key":"D","text":"社会公平"}],"answer":["A","C","D"],"explanation":"**ACD（数据安全、人机协同安全、社会公平）** B\"风险报酬\"是金融/投资概念，不属于工程师伦理责任，是本题唯一干扰项。","note":""},{"id":"12-6","chapter":12,"number":6,"type":"multiple","stem":"下列属于智能制造领域工程师职业道德专责和行为规范的是()","options":[{"key":"A","text":"公平平等意识"},{"key":"B","text":"良好的诚信关系"},{"key":"C","text":"专业职业素养"},{"key":"D","
