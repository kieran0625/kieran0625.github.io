text":"关注环境保护"}],"answer":["A","B","C","D"],"explanation":"**ABCD** 公平平等意识、诚信关系、职业素养、环境保护均为职业道德专责和行为规范。","note":""},{"id":"12-7","chapter":12,"number":7,"type":"boolean","stem":"智能制造过程中由于人机交互会不善会出现人身事故和设备事故。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 人机交互不善确实可能造成人身事故与设备事故，这正是人机协同安全伦理责任的由来。","note":""},{"id":"12-8","chapter":12,"number":8,"type":"boolean","stem":"智能制造中的数据可以在不被约束下任意被使用场合。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** 数据使用必须受法律与伦理约束（目的限定、最小必要），不能\"无约束任意使用\"。","note":""},{"id":"12-9","chapter":12,"number":9,"type":"boolean","stem":"智能制造工程师按需要尽量多地搜集用户和生产过程的数据。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** 数据搜集应遵循最小必要原则，\"尽量多搜集\"违背数据伦理。","note":""},{"id":"12-10","chapter":12,"number":10,"type":"boolean","stem":"\"无人工厂\"只需坐在办公室盯着大屏幕点击鼠标就可以24小时不间断安全生产。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** \"无人工厂\"仍需人员巡检、维护与应急值守，盯着屏幕点鼠标不能保证 24 小时安全生产，说法绝对化。","note":""},{"id":"12-11","chapter":12,"number":11,"type":"boolean","stem":"智能制造带来技术创新与产业升级的同时也会引发就业和岗位竞争问题。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** 智能制造在推动创新升级的同时确实引发就业替代与岗位竞争问题。","note":""},{"id":"13-1","chapter":13,"number":1,"type":"single","stem":"用于装配无侦-5无人侦察机的发动机是( )","options":[{"key":"A","text":"涡喷6发动机"},{"key":"B","text":"涡喷7发动机"},{"key":"C","text":"涡喷11发动机"},{"key":"D","text":"涡喷13发动机"}],"answer":["C"],"explanation":"**C — 涡喷11发动机。** 无侦-5 装配的是北航研制的 WP-11（涡喷11）发动机，与第 2 题呼应。","note":""},{"id":"13-2","chapter":13,"number":2,"type":"single","stem":"装配了北航研制的WP-11发动机的无侦-5多用途无人驾驶飞机定型生产的事迹，被铭刻在( )","options":[{"key":"A","text":"国家博物馆收藏"},{"key":"B","text":"一颗通讯卫星上"},{"key":"C","text":"一个军事基地飞机场"},{"key":"D","text":"中华世纪坛青铜甬道上"}],"answer":["D"],"explanation":"**D — 中华世纪坛青铜甬道上。** 无侦-5 定型生产的事迹被铭刻在表现中华五千年文化的中华世纪坛青铜甬道上（第 17 题判断即复述此点，可互相印证）。","note":""},{"id":"13-3","chapter":13,"number":3,"type":"single","stem":"实现从涡喷到涡扇发动机的更新换代，中国航空工业对英国罗尔斯-罗伊斯公司的\"斯贝\"MK202型发动机采用的措施是( )","options":[{"key":"A","text":"测绘仿制"},{"key":"B","text":"引进其全套技术"},{"key":"C","text":"购买部分零件进行组装"},{"key":"D","text":"通过第三方购买整机贴牌改名"}],"answer":["B"],"explanation":"**B — 引进其全套技术。** \"斯贝\"MK202 是通过全面引进技术后消化、吸收，实现涡喷到涡扇的更新换代（第 18 题呼应）。测绘仿制（A）是早期涡喷系列的路子，不是斯贝。","note":""},{"id":"13-4","chapter":13,"number":4,"type":"single","stem":"北航高歌教授的\"沙丘驻涡火焰稳定器\"发明创造来自( )","options":[{"key":"A","text":"通过测绘仿制"},{"key":"B","text":"通过观测宇宙而想象的"},{"key":"C","text":"通过公式推导计算得到的"},{"key":"D","text":"通过观察沙漠中沙丘形状"}],"answer":["D"],"explanation":"**D — 通过观察沙漠中沙丘形状。** 高歌教授从沙漠沙丘的驻涡现象获得灵感，发明\"沙丘驻涡火焰稳定器\"。注意 B\"观测宇宙而想象\"是干扰项——第 20 题判断即考这一点，答案为 ×。","note":""},{"id":"13-5","chapter":13,"number":5,"type":"single","stem":"为国产商用大飞机C919装上\"中国心\"，其国产型号是( )","options":[{"key":"A","text":"CJ-1000A发动机"},{"key":"B","text":"LEAP-1C发动机"},{"key":"C","text":"CFM56-9发动机"},{"key":"D","text":"GE90发动机"}],"answer":["A"],"explanation":"**A — CJ-1000A发动机。** C919 的\"中国心\"国产型号是长江 CJ-1000A；现在装配的 LEAP-1C（B）是中外合作机型，非国产。","note":""},{"id":"13-6","chapter":13,"number":6,"type":"single","stem":"装配双发飞机进行跨洋飞行，对发动机的可靠性要求是( )","options":[{"key":"A","text":"只能在能找到1小时的备降机场折线飞行"},{"key":"B","text":"维修要快速"},{"key":"C","text":"不同的空中停车率其ETOPS指标不同"},{"key":"D","text":"由适航当局给定"}],"answer":["C"],"explanation":"**C — 不同的空中停车率其ETOPS指标不同。** ETOPS（双发延程飞行）标准与发动机空中停车率直接挂钩：停车率越低，允许的备降时间越长。A 把\"1小时\"说死，是旧标准表述；D\"由适航当局给定\"看似有理，但本题考的是可靠性与 ETOPS 指标的对应关系。","note":""},{"id":"13-7","chapter":13,"number":7,"type":"single","stem":"为提高性能又要降低型号研制中的技术风险，可采取技术措施是( )","options":[{"key":"A","text":"采用全新的技术"},{"key":"B","text":"衍生发展的途径"},{"key":"C","text":"成本低的零部件"},{"key":"D","text":"采用新的材料、新的结构和新的工艺"}],"answer":["B"],"explanation":"**B — 衍生发展的途径。** 在成熟型号上衍生发展，既能提高性能又能降低技术风险；全新技术（A）、新材料新结构新工艺（D）恰恰是高风险路线。","note":""},{"id":"13-8","chapter":13,"number":8,"type":"single","stem":"对于影响安全性后果的关键件，应采取的预防性维修策略是( )","options":[{"key":"A","text":"视情维修和故障后维修"},{"key":"B","text":"定期维修和视情维修"},{"key":"C","text":"定期维修和故障后维修"},{"key":"D","text":"没有适合的维修办法"}],"answer":["B"],"explanation":"**B — 定期维修和视情维修。** 影响安全性的关键件必须采用预防性维修（定期+视情）；故障后维修（事后维修）只适用于非关键件。","note":""},{"id":"13-9","chapter":13,"number":9,"type":"multiple","stem":"航空发动机研制的特点有( )","options":[{"key":"A","text":"研制周期长"},{"key":"B","text":"涉及多学科"},{"key":"C","text":"投资成本大"},{"key":"D","text":"技术风险高"}],"answer":["A","B","C","D"],"explanation":"**ABCD** — 周期长、多学科、投资大、风险高，四点都是航空发动机研制的典型特点。","note":""},{"id":"13-10","chapter":13,"number":10,"type":"multiple","stem":"为保障飞行安全，发动机做鸟撞试验，需要考虑的试验要求和因素有( )","options":[{"key":"A","text":"鸟的飞行姿态"},{"key":"B","text":"鸟的重量"},{"key":"C","text":"撞击风扇叶片的部位"},{"key":"D","text":"飞行速度"}],"answer":["B","C","D"],"explanation":"**BCD** — 鸟撞试验考核鸟的重量（撞性能量）、撞击风扇叶片的部位、飞行速度（相对撞击速度）；鸟的飞行姿态（A）不是试验要求因素。","note":""},{"id":"13-11","chapter":13,"number":11,"type":"multiple","stem":"燃气轮机发动机的种类可以划分为( )","options":[{"key":"A","text":"活塞式"},{"key":"B","text":"涡轮螺旋桨"},{"key":"C","text":"蒸汽机"},{"key":"D","text":"涡轮轴"},{"key":"E","text":"涡轮风扇"}],"answer":["A","B","D","E"],"explanation":"**ABDE** — 按本课口径，航空发动机种类划分为活塞式（A）、涡轮螺旋桨（B）、涡轮轴（D）、涡轮风扇（E）；蒸汽机（C）不是航空发动机，排除即可。","note":""},{"id":"13-12","chapter":13,"number":12,"type":"multiple","stem":"采用健康监视手段的目的是( )","options":[{"key":"A","text":"保障飞行安全"},{"key":"B","text":"确保机件不损伤"},{"key":"C","text":"提高经济效益"},{"key":"D","text":"降低维修费用"}],"answer":["A","C","D"],"explanation":"**ACD** — 健康监视目的：保障飞行安全、提高经济效益、降低维修费用。B\"确保机件不损伤\"过于绝对，监视不能防止损伤本身。","note":""},{"id":"13-13","chapter":13,"number":13,"type":"multiple","stem":"军用发动机设计要求有( )","options":[{"key":"A","text":"高推重比"},{"key":"B","text":"高可靠性"},{"key":"C","text":"长寿命"},{"key":"D","text":"低燃油消耗"}],"answer":["A","B","C","D"],"explanation":"**ABCD** — 军用发动机要求高推重比、高可靠性、长寿命、低燃油消耗四项俱全。","note":""},{"id":"13-14","chapter":13,"number":14,"type":"multiple","stem":"采用系统工程方法可以实现发动机研制的目标有( )","options":[{"key":"A","text":"缩短研制周期"},{"key":"B","text":"避免工程返工"},{"key":"C","text":"降低成本的目标"},{"key":"D","text":"消除故障的发生"}],"answer":["A","B","C"],"explanation":"**ABC** — 系统工程可缩短周期、避免返工、降低成本；D\"消除故障的发生\"过于绝对，只能减少和控制。","note":""},{"id":"13-15","chapter":13,"number":15,"type":"multiple","stem":"发动机型号研制的技术路线有( )","options":[{"key":"A","text":"修复仿制"},{"key":"B","text":"测绘仿制"},{"key":"C","text":"改进改型"},{"key":"D","text":"自主设计"}],"answer":["A","B","C","D"],"explanation":"**ABCD** — 修复仿制、测绘仿制、改进改型、自主设计都是型号研制技术路线。","note":""},{"id":"13-16","chapter":13,"number":16,"type":"multiple","stem":"可跨洋飞行的波音777飞机，可装配的发动机型号有( )","options":[{"key":"A","text":"GE90发动机"},{"key":"B","text":"PW4084发动机"},{"key":"C","text":"LEAP-1C发动机"},{"key":"D","text":"瑞达800发动机"}],"answer":["A","B","D"],"explanation":"**ABD** — 波音777 可选 GE90、PW4084、瑞达（Trent）800 三种发动机；LEAP-1C（C）是 C919 的配套发动机。","note":""},{"id":"13-17","chapter":13,"number":17,"type":"boolean","stem":"北航研制的多用途无人驾驶飞机的事迹被铭刻在表现中华五千年文化的中华世纪坛青铜甬道上。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** — 与第 2 题同一事实。","note":""},{"id":"13-18","chapter":13,"number":18,"type":"boolean","stem":"通过全面引进、消化、吸收英国\"斯贝\"MK202发动机，快速提升国产军用小涵道比涡扇发动机研制和生产能力。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** — 与第 3 题同一事实：全面引进、消化、吸收斯贝，提升国产小涵道比涡扇能力。","note":""},{"id":"13-19","chapter":13,"number":19,"type":"boolean","stem":"所有的国产航空发动机都是抄袭侵权国外知识产权的。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** — \"所有……都是抄袭\"以偏概全；测绘仿制有历史背景，且已有自主设计路线（见第 15 题）。","note":""},{"id":"13-20","chapter":13,"number":20,"type":"boolean","stem":"北航高歌教授的\"沙丘驻涡火焰稳定器\"发明，是通过观测宇宙而想象出来的。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** — 沙丘驻涡火焰稳定器来自观察沙漠沙丘，不是观测宇宙（见第 4 题）。","note":""},{"id":"13-21","chapter":13,"number":21,"type":"boolean","stem":"企业自筹经费主动承担技术发明的试验任务，体现了工程伦理学所倡导的企业不以追求经济利益为本，彰显了企业的担当精神。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** — 企业自筹经费承担试验任务，体现不以追求经济利益为本的担当精神，符合工程伦理学倡导。","note":""},{"id":"14-1","chapter":14,"number":1,"type":"single","stem":"在交通工程中，什么是最重要的？（ ）","options":[{"key":"A","text":"减少成本"},{"key":"B","text":"保护环境"},{"key":"C","text":"提高效率"},{"key":"D","text":"确保安全"}],"answer":["D"],"explanation":"**D（确保安全）** — 交通工程的首要目标是安全，成本、效率、环保都要让位于安全。","note":""},{"id":"14-2","chapter":14,"number":2,"type":"single","stem":"在处理交通安全问题时，以下哪个原则最符合交通工程伦理？（ ）","options":[{"key":"A","text":"最少干预原则"},{"key":"B","text":"完全平等原则"},{"key":"C","text":"最大幸福原则"},{"key":"D","text":"公正原则"}],"answer":["D"],"explanation":"**D（公正原则）** — 交通安全问题涉及道路使用者之间的权益分配，交通工程伦理强调公正原则。","note":""},{"id":"14-3","chapter":14,"number":3,"type":"single","stem":"以下哪个交通工程伦理原则最符合\"公正\"的概念？（ ）","options":[{"key":"A","text":"所有道路使用者应享有平等的权利和机会"},{"key":"B","text":"所有道路使用者的利益应始终得到最大化"},{"key":"C","text":"最小限制地使用道路资源"},{"key":"D","text":"最大化道路系统的效率"}],"answer":["A"],"explanation":"**A（所有道路使用者应享有平等的权利和机会）** — \"公正\"即权利与机会的平等；B 是功利主义的最大化思路，C/D 是效率取向。","note":""},{"id":"14-4","chapter":14,"number":4,"type":"single","stem":"在交通工程中，什么样的措施最能体现保护弱势群体的利益？（ ）","options":[{"key":"A","text":"设置明显的交通标志"},{"key":"B","text":"设立公交车专用道"},{"key":"C","text":"对危险路段进行整改"},{"key":"D","text":"对行人友好型街道进行改造"}],"answer":["D"],"explanation":"**D（对行人友好型街道进行改造）** — 行人、骑行者等是交通弱势群体，行人友好型改造最直接地保护其利益。","note":""},{"id":"14-5","chapter":14,"number":5,"type":"single","stem":"在无人驾驶的情况下，如果发生交通事故，那么应该由谁来承担责任？（ ）","options":[{"key":"A","text":"驾驶员"},{"key":"B","text":"车辆所有者"},{"key":"C","text":"车辆制造商"},{"key":"D","text":"无法确定"}],"answer":["A"],"explanation":"**A（驾驶员）⚠** — 网络答案给 A。按现行法律框架，即便开启辅助/自动驾驶，驾驶员仍是安全第一责任人；但若课程语境指完全无人驾驶，答案可能倾向 B/C。建议对照课件中\"责任主体\"一节确认。","note":"原资料对本题标注存疑：责任主体取决于辅助驾驶或完全无人驾驶的具体语境，请结合课件核对。"},{"id":"14-6","chapter":14,"number":6,"type":"single","stem":"哪种自动驾驶汽车的伦理设计方案更具有可接受性？（ ）","options":[{"key":"A","text":"将伤害程度降至最低"},{"key":"B","text":"将个人利益最大化"},{"key":"C","text":"尊重人类价值观"},{"key":"D","text":"维护社会秩序"}],"answer":["A"],"explanation":"**A（将伤害程度降至最低）⚠** — 网络答案给 A（功利主义式的伤害最小化）。直觉上 C\"尊重人类价值观\"也可辩，但本课程口径为伤害最小化，以课件为准。","note":"原资料对本题标注存疑：课程采用伤害最小化的口径，请结合课件核对。"},{"id":"14-7","chapter":14,"number":7,"type":"single","stem":"当车路协同智能交通系统中的车辆面临不可避免的碰撞时，应该优先考虑保护谁的利益？（ ）","options":[{"key":"A","text":"行人"},{"key":"B","text":"乘客"},{"key":"C","text":"其他车辆"},{"key":"D","text":"所有相关人员的利益"}],"answer":["D"],"explanation":"**D（所有相关人员的利益）** — 不可避免碰撞时不应只偏向乘客或行人，而应统筹保护所有相关人员，体现公正原则。","note":""},{"id":"14-8","chapter":14,"number":8,"type":"multiple","stem":"以下哪些是交通伦理强调的重要原则？（ ）","options":[{"key":"A","text":"安全第一"},{"key":"B","text":"尊重他人"},{"key":"C","text":"守法合规"},{"key":"D","text":"效率至上"},{"key":"E","text":"保护环境"}],"answer":["A","B","C","E"],"explanation":"**ABCE（安全第一、尊重他人、守法合规、保护环境）** — 不选 D\"效率至上\"：交通伦理反对以效率压倒安全。","note":""},{"id":"14-9","chapter":14,"number":9,"type":"multiple","stem":"在驾驶过程中，下列哪些行为符合交通伦理的要求？（ ）","options":[{"key":"A","text":"积极礼让行人"},{"key":"B","text":"按规定车道行驶"},{"key":"C","text":"保持安全车距"},{"key":"D","text":"合理控制车速"},{"key":"E","text":"闯红灯"}],"answer":["A","B","C","D"],"explanation":"**ABCD** — 礼让行人、按规定车道、保持车距、控制车速均符合；E 闯红灯明显违反。","note":""},{"id":"14-10","chapter":14,"number":10,"type":"multiple","stem":"在处理与其他驾驶员的冲突时，驾驶员应该如何遵守交通伦理？（ ）","options":[{"key":"A","text":"保持冷静，不情绪化"},{"key":"B","text":"以安全为重，避免争执"},{"key":"C","text":"遵循道路优先级，不强抢通过"},{"key":"D","text":"体谅他人，给予宽容和理解"},{"key":"E","text":"如遇挑衅，坚决反击以维护自身权益"}],"answer":["A","B","C","D"],"explanation":"**ABCD** — 冷静、安全为重、遵循优先级、宽容体谅；E\"坚决反击\"违背交通伦理。","note":""},{"id":"14-11","chapter":14,"number":11,"type":"multiple","stem":"对于公共交通工具的使用，交通伦理对驾驶员有哪些要求？（ ）","options":[{"key":"A","text":"熟悉并遵守公共交通工具的乘坐规定"},{"key":"B","text":"在驾驶过程中避免与乘客发生争执"},{"key":"C","text":"在繁忙或危险情况下优先保障乘客的安全"},{"key":"D","text":"以高效快捷的方式完成驾驶任务，确保乘客及时到达目的地"},{"key":"E","text":"对乘客的随身物品进行必要的安全检查"}],"answer":["A","B","C"],"explanation":"**ABC** — 不选 D（高效快捷不是伦理要求，安全优先）、E（随身物品安检是运营方/安检职责，非驾驶员伦理要求）。","note":""},{"id":"14-12","chapter":14,"number":12,"type":"multiple","stem":"在自动驾驶汽车的伦理问题上，以下哪些观点可能存在争议？（ ）","options":[{"key":"A","text":"所有乘客的生命价值是相等的"},{"key":"B","text":"行人的生命价值高于乘客的生命价值"},{"key":"C","text":"所有人的生命价值高于所有其他物种的生命价值"},{"key":"D","text":"机器不应具有任何伦理决策的能力"}],"answer":["A","B","C","D"],"explanation":"**ABCD** — 四个观点在自动驾驶伦理讨论中均存在争议：生命是否等价、行人 vs 乘客优先级、人类中心主义、机器是否应有伦理决策能力。","note":""},{"id":"14-13","chapter":14,"number":13,"type":"multiple","stem":"在设计自动驾驶汽车时，应考虑到以下哪些伦理原则？（ ）","options":[{"key":"A","text":"平等原则：对待所有道路使用者公平公正"},{"key":"B","text":"安全原则：优先考虑减少伤亡和事故"},{"key":"C","text":"高效原则：提高交通效率，降低拥堵和延误"},{"key":"D","text":"隐私原则：保护乘客和行人的个人隐私"}],"answer":["A","B","D"],"explanation":"**ABD（平等、安全、隐私）** — 不选 C\"高效原则\"：效率不属于伦理设计原则层面。","note":""},{"id":"14-14","chapter":14,"number":14,"type":"multiple","stem":"在车路协同智能交通系统中，应该如何处理驾驶员与其他道路使用者的冲突？（ ）","options":[{"key":"A","text":"提供实时交通信息以协助驾驶员做出合理决策"},{"key":"B","text":"设计冲突解决算法以自动处理冲突"},{"key":"C","text":"为道路使用者制定明确的优先级"},{"key":"D","text":"由远程监控人员对实时状况进行干预"}],"answer":["A","B","D"],"explanation":"**ABD** — 提供实时信息、冲突解决算法、远程监控干预；不选 C\"制定明确优先级\"——给人群分等级有悖公正。","note":""},{"id":"14-15","chapter":14,"number":15,"type":"boolean","stem":"在车路协同智能交通系统中，行人和驾驶员的权益应得到平等保护。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** — 车路协同系统中行人与驾驶员权益平等保护。","note":""},{"id":"14-16","chapter":14,"number":16,"type":"boolean","stem":"在处理车路协同智能交通系统的伦理问题时，只需考虑驾驶员的利益。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** — 伦理问题须兼顾行人、乘客等所有相关方，不能只考虑驾驶员。","note":""},{"id":"14-17","chapter":14,"number":17,"type":"boolean","stem":"公交优先是指赋予公共交通车辆在道路交通中的优先通行权。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**√** — 公交优先即赋予公共交通车辆道路优先通行权（专用道、信号优先等）。","note":""},{"id":"14-18","chapter":14,"number":18,"type":"boolean","stem":"在自动驾驶汽车的伦理问题上，应优先考虑自动驾驶汽车乘客的生命安全。（ ）","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**×** — 不应只优先本车乘客，须平等保护所有道路使用者（与第 7 题口径一致）。","note":""},{"id":"15-1","chapter":15,"number":1,"type":"single","stem":"一些集成电路领域相关的工程建设产生废水、废气等污染，这属于工程对( )的影响。","options":[{"key":"A","text":"环境"},{"key":"B","text":"经济"},{"key":"C","text":"社会"},{"key":"D","text":"资源"}],"answer":["A"],"explanation":"**废水废气污染属于工程对（）影响 —— A 环境**\n废水、废气是典型的工程活动对环境要素的污染。选 A。","note":""},{"id":"15-2","chapter":15,"number":2,"type":"single","stem":"工程师在遭遇伦理困境时应该对规范进行反思、认识、实践，这就要求工程师必须在现实的工程实践中做到( )","options":[{"key":"A","text":"将\"对\"与\"错\"进行准确区分"},{"key":"B","text":"将经济效益放在首位"},{"key":"C","text":"把握原则性与灵活性的统一"},{"key":"D","text":"无条件遵守职业伦理章程的规范要求"}],"answer":["C"],"explanation":"**伦理困境中应做到（）—— C 把握原则性与灵活性的统一**\n伦理困境的特点正是原则之间冲突、无法简单 dichotomy：A\"准确区分对错\"过于理想，B\"经济效益首位\"违背伦理立场，D\"无条件遵守伦理章程\"忽略了情境灵活性。选 C。","note":""},{"id":"15-3","chapter":15,"number":3,"type":"single","stem":"集成电路技术是支撑经济社会发展和保障国家安全的战略性、基础性和( )产业：","options":[{"key":"A","text":"先导性"},{"key":"B","text":"长远性"},{"key":"C","text":"目标性"},{"key":"D","text":"发展性"}],"answer":["A"],"explanation":"**集成电路是战略性、基础性和（）产业 —— A 先导性**\n本课口径：\"战略性、基础性、先导性\"三个定语固定搭配。选 A。","note":""},{"id":"15-4","chapter":15,"number":4,"type":"single","stem":"集成电路设计是通过( )实现特定功能的过程","options":[{"key":"A","text":"逻辑电路绘制"},{"key":"B","text":"电子元件设计"},{"key":"C","text":"逻辑电路设计"},{"key":"D","text":"电子元件加工"}],"answer":["C"],"explanation":"**集成电路设计通过（）实现特定功能 —— C 逻辑电路设计**\n设计环节的核心是把功能需求转化为逻辑电路方案；\"绘制\"只是表达手段，\"元件设计/加工\"属于器件与制造层面。选 C。","note":""},{"id":"15-5","chapter":15,"number":5,"type":"single","stem":"集成电路制造分为两大环节：晶圆制造和( )","options":[{"key":"A","text":"晶圆采集"},{"key":"B","text":"晶圆制作"},{"key":"C","text":"晶圆设计"},{"key":"D","text":"晶圆加工"}],"answer":["D"],"explanation":"**晶圆制造和（）—— D 晶圆加工**\n制造环节中，晶圆制造之后是对晶圆的进一步加工（切割、减薄等）。选 D。","note":""},{"id":"15-6","chapter":15,"number":6,"type":"single","stem":"在对芯片进行微细加工的过程中需要用( )清洗硅片","options":[{"key":"A","text":"超纯水"},{"key":"B","text":"纯净水"},{"key":"C","text":"自来水"},{"key":"D","text":"蒸馏水"}],"answer":["A"],"explanation":"**（）清洗硅片 —— A 超纯水**\n硅片清洗对杂质含量要求极高，必须使用超纯水。选 A。","note":""},{"id":"15-7","chapter":15,"number":7,"type":"single","stem":"( )是工程师在面临伦理责任时可以借鉴的行动指南","options":[{"key":"A","text":"工程师的职业守则"},{"key":"B","text":"工程师的伦理规范"},{"key":"C","text":"工程师的技术指标"},{"key":"D","text":"工程师的绩效考核"}],"answer":["B"],"explanation":"**面临伦理责任可借鉴的行动指南是（）—— B 伦理规范**\n\"行动指南\"对应伦理规范；职业守则偏行为约束，技术指标与绩效考核不是伦理层面的指南。选 B。","note":""},{"id":"15-8","chapter":15,"number":8,"type":"single","stem":"英特尔与中科院微电子所涉及专利纠纷的是( )技术","options":[{"key":"A","text":"MOSFET"},{"key":"B","text":"JFET"},{"key":"C","text":"STT-MRAM"},{"key":"D","text":"FinFET"}],"answer":["D"],"explanation":"**英特尔与中科院微电子所的专利纠纷涉及（）技术 —— D FinFET**\n该纠纷围绕 FinFET（鳍式场效应晶体管）结构专利。选 D。MOSFET/JFET 是更早的通用器件类型，STT-MRAM 是磁性存储技术，均不符。","note":""},{"id":"15-9","chapter":15,"number":9,"type":"single","stem":"在全球知识产权大背景下，国际知识产权纠纷的案例层出不穷，相关的伦理问题值得深思，这意味着知识产权相关伦理问题正在走向( )","options":[{"key":"A","text":"国际化"},{"key":"B","text":"复杂化"},{"key":"C","text":"尖端化"},{"key":"D","text":"前沿化"}],"answer":["A"],"explanation":"**知识产权伦理问题走向（）—— A 国际化**\n本讲强调集成电路知识产权纠纷跨越国界、走向国际化，并与第11题的\"三方面\"呼应。选 A。","note":""},{"id":"15-10","chapter":15,"number":10,"type":"single","stem":"对于进步异常迅速的尖端技术领域，更要关注相关的知识产权法律法规的建立健全，构建出清晰、合理、可( )的法律框架","options":[{"key":"A","text":"延续"},{"key":"B","text":"逆转"},{"key":"C","text":"执行"},{"key":"D","text":"推动"}],"answer":["C"],"explanation":"**建立清晰、合理、可（）的法律框架 —— C 执行**\n法律框架的要害在于落地，\"可执行\"是固定搭配。选 C。","note":""},{"id":"15-11","chapter":15,"number":11,"type":"multiple","stem":"知识产权相关工程伦理问题带来的启示可以归纳为哪三个方面( )。","options":[{"key":"A","text":"国际化"},{"key":"B","text":"复杂化"},{"key":"C","text":"普遍化"},{"key":"D","text":"尖端化"}],"answer":["A","B","D"],"explanation":"**（多选）启示的三方面 —— ABD 国际化、复杂化、尖端化**\n与第9题联动：知识产权伦理问题呈现国际化、复杂化、尖端化三重趋势；C\"普遍化\"不在其列。选 ABD。","note":""},{"id":"15-12","chapter":15,"number":12,"type":"multiple","stem":"集成电路产业包括那些主要产业链环节?( )","options":[{"key":"A","text":"集成电路设计"},{"key":"B","text":"集成电路制造"},{"key":"C","text":"集成电路封装与测试"},{"key":"D","text":"集成电路批量生产"}],"answer":["A","B","C"],"explanation":"**（多选）集成电路产业链环节 —— ABC 设计、制造、封装与测试**\n产业链三大环节即设计、制造、封装与测试；\"批量生产\"已包含在制造中，不是并列环节。选 ABC。","note":""},{"id":"15-13","chapter":15,"number":13,"type":"multiple","stem":"可以从哪些方面推进企业内清洁生产的实施?( )","options":[{"key":"A","text":"选择无毒无害的生产原料"},{"key":"B","text":"加强企业内部的管理，防止发生污染事故"},{"key":"C","text":"寻找国际仲裁机构寻求帮助"},{"key":"D","text":"健全相关法律法规"}],"answer":["A","B","D"],"explanation":"**（多选）清洁生产的做法 —— ABD**\nA 使用无毒无害原料、B 加强内部管理防止污染事故、D 健全法律法规均属于本讲给出的环境保护路径；C\"国际仲裁机构\"是解决知识产权争端的手段，与清洁生产无关。选 ABD。","note":""},{"id":"15-14","chapter":15,"number":14,"type":"multiple","stem":"集成电路工程建设对环境产生的影响主要包括。( )","options":[{"key":"A","text":"清洗过程产生的污水如果处理不好会对自然水源造成污染"},{"key":"B","text":"排出的有害气体有可能危害人们的健康"},{"key":"C","text":"部分废弃物对环境具有危害性，甚至多数有剧毒"},{"key":"D","text":"排放物对环境没有任何影响"}],"answer":["A","B","C"],"explanation":"**（多选）工程活动的环境影响 —— ABC**\nA 污水污染水源、B 有害气体危害健康、C 部分废弃物具有剧毒，都是实录中的负面影响；D\"没有任何影响\"明显错误。选 ABC。","note":""},{"id":"15-15","chapter":15,"number":15,"type":"multiple","stem":"\"汉芯\"事件给人们带来哪些启发?( )","options":[{"key":"A","text":"工程师在工作中应当遵循公平正义准则"},{"key":"B","text":"科技工作者需要处理好技术与伦理的关系"},{"key":"C","text":"工程师应该肩负起自己承担的工程伦理责任"},{"key":"D","text":"工程师应该具备在利益与道德矛盾中做出道德选择的能力"}],"answer":["A","B","C","D"],"explanation":"**（多选）\"汉芯\"事件的启发 —— ABCD**\n公平正义准则、技术与伦理的关系、工程伦理责任、利益与道德矛盾中的道德选择，四项都是本讲总结的教训。全选。","note":""},{"id":"15-16","chapter":15,"number":16,"type":"multiple","stem":"集成电路已经渗透进了我们生活的哪些方面?( )","options":[{"key":"A","text":"移动智能终端"},{"key":"B","text":"卫星导航"},{"key":"C","text":"云计算"},{"key":"D","text":"物联网"}],"answer":["A","B","C","D"],"explanation":"**（多选）集成电路渗透生活的领域 —— ABCD**\n移动智能终端、卫星导航、云计算、物联网全部依赖集成电路。全选。","note":""},{"id":"15-17","chapter":15,"number":17,"type":"multiple","stem":"下述方案，哪些能够有效促进知识产权相关的伦理问题的解决?( )","options":[{"key":"A","text":"寻求国际争端解决机构的帮助，制定全球知识产权标准和准则，使双方的利益得到平衡"},{"key":"B","text":"强调工程师的责任意识，同时划定工程师行动的边界"},{"key":"C","text":"审查和革新知识产权相关领域的法律法规，确保符合新的技术和市场发展趋势"},{"key":"D","text":"提高对于环境保护的意识，尽量选择无毒无害的原料，使生产更安全更清洁"}],"answer":["A","C"],"explanation":"**（多选）促进知识产权伦理问题解决的措施 —— AC**\nA（国际争端机构＋全球标准平衡各方利益）与 C（审查革新法律法规，使其符合新技术与市场趋势）直接针对知识产权问题；B 讲的是工程师责任意识与行动边界（属于一般伦理责任路径），D 讲的是环保意识与清洁生产（属于环境路径），不属于本题范围。选 AC。","note":""},{"id":"15-18","chapter":15,"number":18,"type":"boolean","stem":"推动半导体集成电路产业健康发展，是应对信息安全挑战的必然选择，也是最终实现核心技术自主可控的必由之路。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**（判断）推动半导体集成电路产业健康发展是应对信息安全挑战的必然选择、核心技术自主可控的必由之路 —— √**\n本讲核心论断，表述完整无绝对化漏洞。正确。","note":""},{"id":"15-19","chapter":15,"number":19,"type":"boolean","stem":"在讨论集成电路设计理念时，只需要工程师代表参与决策。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**（判断）讨论集成电路设计理念只需要工程师代表参与决策 —— ×**\n\"只需要\"是绝对化错误：集成电路设计涉及伦理、法律、环境、公众利益等多元主体，工程共同体乃至社会公众都应参与。错误。","note":""},{"id":"15-20","chapter":15,"number":20,"type":"boolean","stem":"当工程风险发生时，往往不能将全部责任归结于某一个人，而需要工程共同体承担。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**（判断）工程风险不能归责于某一个人，而需由工程共同体承担 —— √**\n现代工程是集体活动，责任由工程共同体分担，本讲与第13讲口径一致。正确。","note":""},{"id":"15-21","chapter":15,"number":21,"type":"boolean","stem":"单纯地以经营销售为目的而复制他人受保护的布图设计而生产芯片，应视为侵权行为。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**（判断）单纯以经营销售为目的复制他人受保护的布图设计生产芯片，应视为侵权 —— √**\n布图设计（拓扑图）受知识产权保护，商业性复制即构成侵权。正确。","note":""},{"id":"15-22","chapter":15,"number":22,"type":"boolean","stem":"对工程师的评价标准是工程师是否把工作做好。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["×"],"explanation":"**（判断）对工程师的评价标准是\"是否把工作做好\" —— ×**\n仅以工作成果评价工程师是片面的：工程伦理要求把社会责任、公众安全与福祉纳入评价标准。错误。","note":""},{"id":"15-23","chapter":15,"number":23,"type":"boolean","stem":"集成电路工程造成环境污染问题的主要原因是生产原料和生产工艺的问题。( )","options":[{"key":"√","text":"正确"},{"key":"×","text":"错误"}],"answer":["√"],"explanation":"**（判断）集成电路工程环境污染的主要原因是生产原料和生产工艺 —— √**\n本讲指出污染根源在于所用的化学物质原料与耗水耗药的制造工艺。正确。","note":""}]};</script>
  <script>(() => {
  'use strict';
  const { chapters, questions } = window.QUESTION_BANK;
  const byId = new Map(questions.map(question => [question.id, question]));
  const labels = { single: '单选题', multiple: '多选题', boolean: '判断题' };
  const storageKey = 'engineering-ethics-progress-v1';
  const $ = selector => document.querySelector(selector);
  const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  const sameAnswer = (a, b) => a.length === b.length && a.every(key => b.includes(key));
  const state = { chapter: 0, type: 'all', scope: 'all', query: '', mode: 'study', showAnswers: true, page: 1, pageSize: 20, order: 'original' };
  const answerVisibility = new Map();
  const openExplanations = new Set();
  const drafts = new Map();
  let bookmarks = new Set(), attempts = {}, randomRanks = new Map(), toastTimer, storageAvailable = true;

  // 损坏或旧版本的本地记录不会阻止题库打开。
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
    if (Array.isArray(saved?.bookmarks)) bookmarks = new Set(saved.bookmarks.filter(id => byId.has(id)));
    if (saved?.attempts && typeof saved.attempts === 'object') {
      for (const [id, record] of Object.entries(saved.attempts)) {
        const question = byId.get(id);
        if (!question || !Array.isArray(record?.selected)) continue;
        const selected = [...new Set(record.selected)].filter(key => question.options.some(option => option.key === key));
        if (!selected.length || (question.type !== 'multiple' && selected.length !== 1)) continue;
        attempts[id] = { selected, correct: sameAnswer(selected, question.answer) };
      }
    }
  } catch { storageAvailable = false; }

  function persist() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({ bookmarks: [...bookmarks], attempts }));
      storageAvailable = true;
    } catch {
      storageAvailable = false;
      toast('浏览器无法保存记录，本次打开期间仍可正常练习。');
    }
    updateSaveLabel();
  }
  function updateSaveLabel() {
    $('#save-label').textContent = storageAvailable ? '学习记录保存在本机' : '当前记录仅在本次打开中保留';
  }
  function toast(message) {
    clearTimeout(toastTimer);
    $('#toast').textContent = message;
    $('#toast').hidden = false;
    toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 2600);
  }

  function highlight(value) {
    const query = state.query.trim();
    if (!query) return escapeHTML(value);
    const terms = query.split(/\s+/).filter(Boolean).sort((a, b) => b.length - a.length);
    const pattern = new RegExp(`(${terms.map(term => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
    return String(value).split(pattern).map((part, index) => index % 2 ? `<mark>${escapeHTML(part)}</mark>` : escapeHTML(part)).join('');
  }
  function markdown(value) {
    // 原资料仅用到加粗和段落；先转义，避免把资料内容当作 HTML 执行。
    return value.split(/\n\s*\n/).map(paragraph => `<p>${escapeHTML(paragraph).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}</p>`).join('');
  }
  const searchText = new Map(questions.map(question => [question.id, [
    question.stem, ...question.options.map(option => option.text),
    `第${question.chapter}讲`, chapters[question.chapter - 1].title
  ].join(' ').toLocaleLowerCase()]));

  function matches(question, ignoreType = false) {
    if (state.chapter && question.chapter !== state.chapter) return false;
    if (!ignoreType && state.type !== 'all' && question.type !== state.type) return false;
    if (state.scope === 'bookmarked' && !bookmarks.has(question.id)) return false;
    if (state.scope === 'wrong' && attempts[question.id]?.correct !== false) return false;
    if (state.scope === 'unanswered' && attempts[question.id]) return false;
    if (state.scope === 'noted' && !question.note) return false;
    const terms = state.query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
    return terms.every(term => searchText.get(question.id).includes(term));
  }
  function filteredQuestions() {
    const result = questions.filter(question => matches(question));
    if (state.order === 'random') result.sort((a, b) => randomRanks.get(a.id) - randomRanks.get(b.id));
    return result;
  }
  function shuffle() {
    const ids = questions.map(question => question.id);
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    randomRanks = new Map(ids.map((id, index) => [id, index]));
  }
  function isRevealed(question) {
    if (state.mode === 'practice' && attempts[question.id] && !drafts.has(question.id)) return true;
    return answerVisibility.has(question.id) ? answerVisibility.get(question.id) : state.showAnswers;
  }
  function updateStats() {
    const records = Object.values(attempts);
    const right = records.filter(record => record.correct).length;
    $('#completed-count').innerHTML = `${records.length}<span>题</span>`;
    $('#accuracy').innerHTML = records.length ? `${Math.round(right / records.length * 100)}<span>%</span>` : '—';
    $('#wrong-count').textContent = records.length - right;
    $('#bookmark-count').textContent = bookmarks.size;
    updateSaveLabel();
  }

  function renderChapters() {
    $('#chapter-nav').innerHTML = `<button type="button" class="chapter-button all-chapters" data-chapter="0" aria-pressed="${state.chapter === 0}">${icon('grid')}<span class="chapter-title">全部章节</span><span class="chapter-count">303</span></button>` + chapters.map(chapter => `<button type="button" class="chapter-button" data-chapter="${chapter.number}" aria-pressed="${state.chapter === chapter.number}"><span class="chapter-number">${String(chapter.number).padStart(2, '0')}</span><span class="chapter-title">${escapeHTML(chapter.title)}</span><span class="chapter-count">${chapter.count}</span></button>`).join('');
    $('#chapter-select').innerHTML = '<option value="0">全部章节 · 303 题</option>' + chapters.map(chapter => `<option value="${chapter.number}">第 ${chapter.number} 讲 · ${escapeHTML(chapter.title)}（${chapter.count} 题）</option>`).join('');
    $('#chapter-select').value = state.chapter;
  }
  function renderFilters() {
    const candidates = questions.filter(question => matches(question, true));
    $('#type-filters').innerHTML = [['all', '全部'], ...Object.entries(labels)].map(([type, label]) => `<button type="button" data-type="${type}" aria-pressed="${state.type === type}">${label}<span>${type === 'all' ? candidates.length : candidates.filter(question => question.type === type).length}</span></button>`).join('');
    document.querySelectorAll('[data-scope]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.scope === state.scope)));
    document.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === state.mode)));
    $('#toggle-answers').hidden = state.mode === 'practice';
    $('#toggle-answers').textContent = state.showAnswers ? '隐藏全部答案' : '显示全部答案';
    $('#reshuffle').hidden = state.order !== 'random';
    $('#mode-help').textContent = state.mode === 'practice'
      ? '选择选项后提交答案；多选题需全部选对。练习与收藏记录自动保存在本机。'
      : state.showAnswers ? '答案已展开，点击「查看解析」理解解题思路。' : '答案已隐藏，可以逐题查看，也可以一键显示全部答案。';
  }

  function renderCard(question) {
    const practice = state.mode === 'practice';
    const revealed = isRevealed(question);
    const record = drafts.has(question.id) ? null : attempts[question.id];
    const selected = drafts.get(question.id) || record?.selected || [];
    const locked = practice && Boolean(record);
    const chapter = chapters[question.chapter - 1];
    const optionHTML = question.options.map(option => {
      const correct = revealed && question.answer.includes(option.key);
      const chosen = practice && selected.includes(option.key);
      const wrong = practice && record && chosen && !question.answer.includes(option.key);
      const classes = ['option', practice && 'practice-option', correct && 'correct-option', chosen && !revealed && 'selected-option', wrong && 'wrong-option'].filter(Boolean).join(' ');
      const input = practice ? `<input type="${question.type === 'multiple' ? 'checkbox' : 'radio'}" name="answer-${question.id}" value="${option.key}" data-option="${question.id}" ${chosen ? 'checked' : ''} ${locked ? 'disabled' : ''} aria-label="${escapeHTML(`${option.key} ${option.text}`)}">` : '';
      const status = wrong ? `${icon('close')}选错` : correct ? `${icon('check')}${practice && record && !chosen ? '漏选' : '正确'}` : '';
      const tag = practice ? 'label' : 'div';
      return `<${tag} class="${classes}">${input}<span class="option-key">${option.key}</span><span class="option-text">${highlight(option.text)}</span>${status ? `<span class="option-status">${status}</span>` : ''}</${tag}>`;
    }).join('');
    const badge = question.type === 'boolean' ? (question.answer[0] === '√' ? '√ 正确' : '× 错误') : question.answer.join('');
    let footer;
    if (practice) {
      footer = `<div class="practice-actions">${record ? `<span class="grading-result ${record.correct ? '' : 'incorrect'}">${record.correct ? '回答正确' : `回答错误 · 你的答案 ${escapeHTML(record.selected.join(''))}`}</span><button type="button" class="text-button" data-action="retry" data-id="${question.id}">${icon('refresh')}重新练习</button>` : `<button type="button" class="primary-button" data-action="submit" data-id="${question.id}" ${selected.length ? '' : 'disabled'}>提交答案</button><span class="answer-hint">${question.type === 'multiple' ? '可选择多个选项' : '请选择一个选项'}</span>`}</div>${record ? '' : `<button type="button" class="text-button" data-action="answer" data-id="${question.id}" aria-expanded="${revealed}" aria-controls="answer-${question.id}">${revealed ? '隐藏答案' : '查看答案'}</button>`}`;
    } else {
      footer = `<span class="answer-hint">${question.type === 'multiple' ? '多选题 · 多个正确选项' : question.type === 'boolean' ? '判断题 · 判断正误' : '单选题 · 一个正确选项'}</span><button type="button" class="text-button" data-action="answer" data-id="${question.id}" aria-expanded="${revealed}" aria-controls="answer-${question.id}">${revealed ? '收起答案' : '查看答案'}${icon('arrow')}</button>`;
    }
    return `<article class="question-card" data-question="${question.id}" aria-labelledby="stem-${question.id}">
      <div class="question-meta"><span class="question-index">${String(question.chapter).padStart(2, '0')} / ${String(question.number).padStart(2, '0')}</span><span class="type-badge type-${question.type}">${labels[question.type]}</span><span class="meta-dot">·</span><span class="question-chapter" title="第 ${question.chapter} 讲 ${escapeHTML(chapter.title)}">第 ${question.chapter} 讲 · ${escapeHTML(chapter.title)}</span><button type="button" class="icon-button bookmark-button" data-action="bookmark" data-id="${question.id}" aria-pressed="${bookmarks.has(question.id)}" aria-label="${bookmarks.has(question.id) ? '取消收藏' : '收藏'}第 ${question.chapter} 讲第 ${question.number} 题" title="${bookmarks.has(question.id) ? '取消收藏' : '收藏题目'}">${icon('star')}</button></div>
      <h3 id="stem-${question.id}">${highlight(question.stem)}</h3>
      <fieldset class="question-options"><legend class="sr-only">第 ${question.chapter} 讲第 ${question.number} 题的选项</legend>${optionHTML}</fieldset>
      ${question.note && (revealed || question.id === '8-15') ? `<div class="source-note">${icon('info')}<span>${escapeHTML(question.note)}</span></div>` : question.note ? '<div class="answer-hint">本题有资料提示，查看答案后显示。</div>' : ''}
      <div class="answer-panel" id="answer-${question.id}" ${revealed ? '' : 'hidden'}><div class="answer-summary"><span>参考答案</span><strong>${badge}</strong></div><details class="explanation" data-explanation="${question.id}" ${openExplanations.has(question.id) ? 'open' : ''}><summary>${icon('arrow')}查看解析</summary><div class="explanation-body">${markdown(question.explanation)}</div></details></div>
      <div class="question-footer">${footer}</div>
    </article>`;
  }

  function renderPagination(total) {
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    const visible = new Set([1, pages, state.page - 1, state.page, state.page + 1]);
    if (state.page <= 2) visible.add(3);
    if (state.page >= pages - 1) visible.add(pages - 2);
    let previous = 0;
    const buttons = [...visible].filter(page => page >= 1 && page <= pages).sort((a, b) => a - b).map(page => {
      const gap = page - previous > 1 ? '<span class="answer-hint">…</span>' : '';
      previous = page;
      return `${gap}<button type="button" data-page="${page}" ${page === state.page ? 'aria-current="page"' : ''} aria-label="第 ${page} 页">${page}</button>`;
    }).join('');
    $('#pagination').innerHTML = total ? `<button type="button" class="page-prev" data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''} aria-label="上一页">${icon('arrow')}</button>${buttons}<button type="button" data-page="${state.page + 1}" ${state.page === pages ? 'disabled' : ''} aria-label="下一页">${icon('arrow')}</button><label class="page-size-label" for="page-size">每页<select id="page-size"><option value="20">20 题</option><option value="50">50 题</option><option value="303">全部</option></select></label>` : '';
    if ($('#page-size')) $('#page-size').value = state.pageSize;
  }
  function renderQuestions() {
    const result = filteredQuestions();
    state.page = Math.max(1, Math.min(state.page, Math.ceil(result.length / state.pageSize) || 1));
    const start = (state.page - 1) * state.pageSize;
    const visible = result.slice(start, start + state.pageSize);
    const scopeNames = { all: '全部题目', unanswered: '未练习', wrong: '我的错题', bookmarked: '我的收藏', noted: '资料提示' };
    $('#results-title').textContent = state.chapter ? `第 ${state.chapter} 讲 · ${chapters[state.chapter - 1].title}` : scopeNames[state.scope];
    $('#result-summary').textContent = result.length ? `共 ${result.length} 题 · 当前 ${start + 1}–${start + visible.length}` : '共 0 题';
    $('#question-list').innerHTML = result.length ? visible.map(renderCard).join('') : `<div class="empty-state">${icon('search')}<h3>没有符合条件的题目</h3><p>${state.scope === 'bookmarked' ? '点击题目右上角的星标，将想复习的题目收藏到这里。' : state.scope === 'wrong' ? '这里显示最近一次练习答错的题目，答对后会自动移出。' : '试试其他关键词，或调整章节、题型和范围。'}</p><button type="button" class="primary-button" data-action="reset">查看全部题目</button></div>`;
    renderPagination(result.length);
  }
  function render() { updateStats(); renderChapters(); renderFilters(); renderQuestions(); }
  function refreshCard(id, focusSelector) {
    const element = document.querySelector(`[data-question="${id}"]`);
    if (!element) return;
    element.outerHTML = renderCard(byId.get(id));
    if (focusSelector) document.querySelector(`[data-question="${id}"] ${focusSelector}`)?.focus({ preventScroll: true });
  }
  function scrollToResults() {
    $('#results-toolbar').scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth', block: 'start' });
  }
  function changeFilter(key, value) {
    state[key] = value;
    state.page = 1;
    render();
  }
  function resetFilters() {
    Object.assign(state, { chapter: 0, type: 'all', scope: 'all', query: '', page: 1, order: 'original' });
    $('#search').value = '';
    $('#sort-order').value = 'original';
    render();
  }

  $('#chapter-nav').addEventListener('click', event => {
    const button = event.target.closest('[data-chapter]');
    if (!button) return;
    changeFilter('chapter', Number(button.dataset.chapter));
    document.querySelector(`[data-chapter="${state.chapter}"]`)?.focus({ preventScroll: true });
    scrollToResults();
  });
  $('#chapter-select').addEventListener('change', event => changeFilter('chapter', Number(event.target.value)));
  $('#type-filters').addEventListener('click', event => {
    const button = event.target.closest('[data-type]');
    if (!button) return;
    changeFilter('type', button.dataset.type);
    document.querySelector(`[data-type="${state.type}"]`)?.focus({ preventScroll: true });
  });
  $('#scope-filters').addEventListener('click', event => {
    const button = event.target.closest('[data-scope]');
    if (button) changeFilter('scope', button.dataset.scope);
  });
  $('#search').addEventListener('input', event => changeFilter('query', event.target.value));
  $('#reset-filters').addEventListener('click', resetFilters);
  $('.brand').addEventListener('click', event => { event.preventDefault(); resetFilters(); window.scrollTo({ top: 0 }); });
  $('.mode-control').addEventListener('click', event => {
    const button = event.target.closest('[data-mode]');
    if (!button || state.mode === button.dataset.mode) return;
    state.mode = button.dataset.mode;
    state.showAnswers = state.mode === 'study';
    answerVisibility.clear();
    openExplanations.clear();
    renderFilters();
    renderQuestions();
  });
  $('#toggle-answers').addEventListener('click', () => {
    state.showAnswers = !state.showAnswers;
    answerVisibility.clear();
    renderFilters();
    renderQuestions();
  });
  $('#sort-order').addEventListener('change', event => {
    if (event.target.value === 'random') shuffle();
    changeFilter('order', event.target.value);
  });
  $('#reshuffle').addEventListener('click', () => { shuffle(); state.page = 1; renderQuestions(); toast('题目顺序已重新打乱'); });
  $('#pagination').addEventListener('click', event => {
    const button = event.target.closest('[data-page]');
    if (!button || button.disabled) return;
    state.page = Number(button.dataset.page);
    renderQuestions();
    scrollToResults();
  });
  $('#pagination').addEventListener('change', event => {
    if (event.target.id !== 'page-size') return;
    state.pageSize = Number(event.target.value);
    state.page = 1;
    renderQuestions();
    scrollToResults();
  });
  $('#question-list').addEventListener('toggle', event => {
    const id = event.target.dataset.explanation;
    if (!id) return;
    event.target.open ? openExplanations.add(id) : openExplanations.delete(id);
  }, true);
  $('#question-list').addEventListener('change', event => {
    const id = event.target.dataset.option;
    if (!id) return;
    const question = byId.get(id);
    const selected = new Set(drafts.get(id) || []);
    if (question.type !== 'multiple') selected.clear();
    event.target.checked ? selected.add(event.target.value) : selected.delete(event.target.value);
    drafts.set(id, [...selected]);
    // 保留真实输入节点，键盘方向键和多选焦点不因重绘丢失。
    const card = event.target.closest('.question-card');
    card.querySelectorAll('input[data-option]').forEach(input => {
      input.closest('.option').classList.toggle('selected-option', input.checked && !isRevealed(question));
    });
    card.querySelector('[data-action="submit"]').disabled = selected.size === 0;
  });
  $('#question-list').addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const { action, id } = button.dataset;
    if (action === 'reset') { resetFilters(); return; }
    const question = byId.get(id);
    if (!question) return;
    if (action === 'bookmark') {
      bookmarks.has(id) ? bookmarks.delete(id) : bookmarks.add(id);
      persist();
      updateStats();
      renderFilters();
      if (state.scope === 'bookmarked') renderQuestions();
      else refreshCard(id, '[data-action="bookmark"]');
    }
    if (action === 'answer') {
      answerVisibility.set(id, !isRevealed(question));
      refreshCard(id, '[data-action="answer"]');
    }
    if (action === 'submit') {
      const selected = drafts.get(id);
      if (!selected?.length) return;
      const correct = sameAnswer(selected, question.answer);
      attempts[id] = { selected: [...selected], correct };
      drafts.delete(id);
      answerVisibility.set(id, true);
      persist();
      updateStats();
      renderFilters();
      // 即时更新动态筛选；toast 在题目移出未练习/错题列表后仍给出判定。
      if (!matches(question)) {
        toast(`${correct ? '回答正确' : '回答错误'}，参考答案：${question.answer.join('')}。题目已移出当前列表。`);
        renderQuestions();
      } else {
        refreshCard(id, '[data-action="retry"]');
        toast(correct ? '回答正确' : `回答错误，参考答案：${question.answer.join('')}`);
      }
    }
    if (action === 'retry') {
      // 重做期间保留上次成绩，下一次提交后再更新错题和统计。
      drafts.set(id, []);
      answerVisibility.set(id, false);
      openExplanations.delete(id);
      refreshCard(id, 'input[data-option]');
    }
  });
  document.addEventListener('keydown', event => {
    const editing = /INPUT|SELECT|TEXTAREA/.test(event.target.tagName) || event.target.isContentEditable;
    if (event.key === '/' && !editing && !event.ctrlKey && !event.metaKey && !event.altKey) { event.preventDefault(); $('#search').focus(); }
    if (event.key === 'Escape' && event.target === $('#search')) { $('#search').value = ''; changeFilter('query', ''); }
  });
  window.addEventListener('scroll', () => { $('#back-to-top').hidden = window.scrollY < 500; }, { passive: true });
  $('#back-to-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' }));
  render();
})();
</script>
</body>
</html>
