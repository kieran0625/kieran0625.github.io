<body>
  <a class="skip-link" href="#main">跳转到题目</a>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1a8 8 0 0 1 13 2L20 12M4 12l.9 3.9a8 8 0 0 0 13 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m16 3 5 5L8 21H3v-5ZM13 6l5 5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v15"/></symbol>
  </svg>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="工程伦理习题库首页"><span class="brand-icon"><svg class="icon"><use href="#i-book"/></svg></span><span>工程伦理<span class="brand-divider">/</span><span class="brand-subtitle">习题库</span></span></a>
      <div class="header-right"><a class="home-link" href="../" aria-label="返回 Kieran 个人主页">个人主页 ↗</a><span class="course-badge">第 1–15 讲</span><span class="save-status"><span class="status-dot"></span><span id="save-label">学习记录保存在本机</span></span></div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="章节导航">
      <div class="sidebar-heading"><span>课程目录</span><span>15 讲</span></div>
      <nav id="chapter-nav" aria-label="按章节筛选"></nav>
      <div class="sidebar-tip"><svg class="icon"><use href="#i-book"/></svg><strong>让每一道题，都有收获。</strong><p>先理解，再记忆。<br>切换练习模式，检验学习成果。</p></div>
    </aside>
    <main id="main" tabindex="-1">
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow"><span></span>ENGINEERING ETHICS</div>
        <h1 id="page-title">工程伦理<span>习题库</span></h1>
        <p class="intro-description">从原理到实践，系统掌握每一讲的知识。</p>
        <div class="overview" aria-label="题库及练习统计">
          <div><strong>303<span>题</span></strong><span class="stat-label">完整习题</span></div>
          <div><strong>15<span>讲</span></strong><span class="stat-label">课程章节</span></div>
          <div><strong id="completed-count">0<span>题</span></strong><span class="stat-label">已练习</span></div>
          <div><strong id="accuracy">—</strong><span class="stat-label">练习正确率</span></div>
        </div>
      </section>
      <section class="filter-panel" aria-label="筛选题目">
        <div class="search-row">
          <div class="search-field"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索题目、选项或知识点…" aria-label="搜索题目、选项或知识点" autocomplete="off"><kbd aria-hidden="true">/</kbd></div>
          <div class="mode-control" aria-label="学习模式"><button type="button" data-mode="study" aria-pressed="true"><svg class="icon"><use href="#i-book"/></svg>背题模式</button><button type="button" data-mode="practice" aria-pressed="false"><svg class="icon"><use href="#i-pencil"/></svg>练习模式</button></div>
        </div>
        <div class="mobile-chapter"><label for="chapter-select">课程章节</label><select id="chapter-select"></select></div>
        <div class="filter-row"><span class="filter-label">题型</span><div id="type-filters" class="chips" aria-label="题型筛选"></div></div>
        <div class="filter-row"><span class="filter-label">范围</span><div class="chips" id="scope-filters" aria-label="练习范围"><button type="button" data-scope="all" aria-pressed="true">全部题目</button><button type="button" data-scope="unanswered" aria-pressed="false">未练习</button><button type="button" data-scope="wrong" aria-pressed="false">错题 <span id="wrong-count">0</span></button><button type="button" data-scope="bookmarked" aria-pressed="false"><svg class="icon"><use href="#i-star"/></svg>已收藏 <span id="bookmark-count">0</span></button><button type="button" data-scope="noted" aria-pressed="false">有资料提示</button></div><button type="button" class="text-button reset-filters" id="reset-filters"><svg class="icon"><use href="#i-refresh"/></svg>重置筛选</button></div>
      </section>
      <div class="results-toolbar" id="results-toolbar">
        <div><h2 id="results-title">全部题目</h2><span class="result-summary" id="result-summary" role="status" aria-live="polite"></span></div>
        <div class="result-actions"><button type="button" class="text-button" id="toggle-answers">隐藏全部答案</button><label class="sr-only" for="sort-order">题目顺序</label><select id="sort-order"><option value="original">默认顺序</option><option value="random">随机顺序</option></select><button type="button" id="reshuffle" class="icon-button" title="重新打乱顺序" aria-label="重新打乱顺序" hidden><svg class="icon"><use href="#i-refresh"/></svg></button></div>
      </div>
      <p class="mode-help" id="mode-help">答案已展开，点击「查看解析」理解解题思路。</p>
      <section id="question-list" aria-label="题目列表"></section>
      <nav id="pagination" class="pagination" aria-label="题目分页"></nav>
      <footer class="page-footer"><span>工程伦理 · 第 1–15 讲习题整理</span><span>答案及解析沿用本地资料；资料提示见对应题目。</span></footer>
    </main>
  </div>
  <button type="button" class="back-to-top" id="back-to-top" aria-label="返回顶部" title="返回顶部" hidden><svg class="icon"><use href="#i-up"/></svg></button>
  <div id="toast" role="status" aria-live="polite" hidden></div>
